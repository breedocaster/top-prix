<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Top Prix</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b0f1c;color:#fff;font-family:"DotGothic16",ui-monospace,monospace;font-size:14px;overscroll-behavior:none}
body{display:flex;justify-content:center}
button{font-family:inherit;font-size:inherit;cursor:pointer}
canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.hidden{display:none!important}
#app{width:100%;max-width:480px;height:100dvh;display:flex;flex-direction:column;background:#141a2e;position:relative;overflow:hidden;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
#top{display:flex;align-items:center;gap:4px;padding:5px 6px;background:linear-gradient(#26345f,#1b2547);border-bottom:2px solid #0b0f1c;flex-wrap:nowrap}
#top .date{color:#ffd84a;font-size:12px;white-space:nowrap}
#top .st{background:#0f1530;border:1px solid #42558f;border-radius:5px;padding:2px 4px;font-size:11px;white-space:nowrap}
#top .money{color:#8ef58e}#top .rp{color:#8fd8ff}#top .fans{color:#ff9fcf}
#top .sp{margin-left:auto;display:flex;gap:3px}
#top .sp button{background:#0f1530;color:#ffd84a;border:1px solid #42558f;border-radius:5px;padding:3px 4px;min-width:30px;font-size:12px}
#top .sp button.on{background:#ffd84a;color:#2a1a00}
#sceneWrap{position:relative;width:100%;aspect-ratio:160/120;background:#000;flex:none}
#scene{width:100%;height:100%}
#ticker{background:#0b0f1c;color:#cfe0ff;font-size:12px;padding:4px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-top:1px solid #2b3963;min-height:24px}
#nextbar{background:#202b52;padding:5px 8px;font-size:12px;color:#ffd84a;border-top:1px solid #34467e;cursor:pointer;min-height:26px}
#activity{flex:1;overflow-y:auto;padding:6px 8px;background:#141a2e;font-size:12px}
#activity .row{display:flex;align-items:center;gap:6px;margin:3px 0}
#activity .lbl{width:118px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:#cdd8f5}
#activity .bar{flex:1;height:8px;background:#0b0f1c;border:1px solid #3a4a80;border-radius:3px;overflow:hidden}
#activity .bar i{display:block;height:100%}
#activity .hd{color:#8fa3d8;font-size:11px;margin-top:6px}
#activity .nw{color:#9fb0d8;font-size:11px;padding:2px 0;border-bottom:1px solid #222c4d}
#menu{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;padding:6px;background:#0f1428;border-top:2px solid #2b3963}
#menu button{background:linear-gradient(#3a5299,#2a3b73);color:#fff;border:2px solid #7f97dd;border-radius:8px;padding:6px 2px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 2px 0 #0b0f1c;position:relative}
#menu button .ic{font-size:20px;line-height:1.1}
#menu button .tx{font-size:11px}
#menu button:active{transform:translateY(1px)}
#menu .badge{position:absolute;top:-4px;right:-3px;background:#ff4d6d;color:#fff;border-radius:8px;font-size:10px;padding:0 4px;border:1px solid #fff}
#toast{position:absolute;left:50%;top:calc(4px + env(safe-area-inset-top));transform:translateX(-50%);z-index:85;pointer-events:none;display:flex;flex-direction:column;gap:4px;align-items:center;width:92%}
#toast div{background:rgba(10,14,30,.92);border:2px solid #ffd84a;border-radius:7px;padding:5px 10px;font-size:12px;animation:tin .25s;max-width:100%;text-align:center}
@keyframes tin{from{opacity:0;transform:translateY(-6px)}to{opacity:1}}
/* windows */
.ov{position:absolute;inset:0;background:rgba(5,8,18,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.win{width:100%;max-height:92%;display:flex;flex-direction:column;background:linear-gradient(#2d4185,#1e2b5c);border:3px solid #fff;border-radius:12px 12px 0 0;box-shadow:0 0 0 3px #0b0f1c;overflow:hidden}
.whead,.wtabs{flex:none}
.whead{display:flex;align-items:center;padding:8px 10px;background:linear-gradient(#3f58ad,#2d4185);border-bottom:2px solid #6d84cf}
.wtitle{flex:1;color:#ffd84a;font-size:17px}
.wclose{background:#c0392b;color:#fff;border:2px solid #fff;border-radius:6px;width:32px;height:30px}
.wback{background:#40508a;color:#fff;border:2px solid #9fb3ff;border-radius:6px;height:30px;margin-right:6px;padding:0 8px}
.wtabs{display:flex;gap:3px;padding:6px 6px 0;background:#22336c;overflow-x:auto}
.wtabs button{flex:1;background:#1a2550;color:#a8b8e8;border:2px solid #4a5d9e;border-bottom:none;border-radius:7px 7px 0 0;padding:6px 4px;white-space:nowrap;font-size:13px}
.wtabs button.on{background:#ffd84a;color:#2a1a00;border-color:#fff}
.wbody{overflow-y:auto;padding:8px;flex:1;min-height:0;-webkit-overflow-scrolling:touch}
.card{background:#34488f;border:2px solid #7389d6;border-radius:8px;padding:7px 8px;margin-bottom:7px;position:relative}
.card.sel{border-color:#ffd84a;box-shadow:0 0 0 2px #ffd84a inset}
.card.lock{opacity:.55;filter:saturate(.4)}
.card.done{border-color:#58c46b}
.row{display:flex;align-items:center;gap:6px}
.sp1{flex:1;min-width:0}
.sub{color:#b9c7f0;font-size:12px}
.hl{color:#ffd84a}
.gd{color:#8ef58e}.bd{color:#ff8a8a}.bl{color:#8fd8ff}
.btn{background:linear-gradient(#ffe684,#f2a81d);color:#3a2200;border:2px solid #7a4a00;border-radius:7px;padding:6px 10px;box-shadow:0 2px 0 #5a3500;white-space:nowrap}
.btn:active{transform:translateY(1px);box-shadow:0 1px 0 #5a3500}
.btn.sm{padding:3px 7px;font-size:12px}
.btn.blue{background:linear-gradient(#9fd2ff,#3f8be0);color:#06213f;border-color:#0d3a6b;box-shadow:0 2px 0 #0d3a6b}
.btn.red{background:linear-gradient(#ff9b9b,#d64545);color:#3a0000;border-color:#6b0d0d;box-shadow:0 2px 0 #6b0d0d}
.btn.gray,.btn:disabled{background:linear-gradient(#bbb,#888);color:#333;border-color:#444;box-shadow:0 2px 0 #333}
.btn.big{font-size:17px;padding:10px 14px;width:100%}
.btn.grn{background:linear-gradient(#b4f5a0,#47b84a);color:#0b2d06;border-color:#1c5a12;box-shadow:0 2px 0 #1c5a12}
.chips{display:flex;flex-wrap:wrap;gap:3px;margin-top:3px}
.chip{font-size:11px;padding:1px 5px;border-radius:4px;background:#1c2754;border:1px solid #4b5ea0;white-space:nowrap}
button.chip{color:#fff;font-family:inherit;cursor:pointer}
.chip.on{background:#ffd84a;color:#2a1a00;border-color:#fff}
.tier-chips{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tier-chips button{background:#1a2550;color:#cfe0ff;border:2px solid #4a5d9e;border-radius:6px;padding:4px 8px;font-size:12px}
.tier-chips button.on{background:#ffd84a;color:#2a1a00;border-color:#fff}
.sbar{display:flex;align-items:center;gap:4px;font-size:11px;margin:1px 0}
.sbar b{width:30px;color:#cfe0ff;font-weight:normal}
.sbar .bar{flex:1;height:7px;background:#0d1330;border-radius:3px;overflow:hidden;border:1px solid #2c3b70}
.sbar .bar i{display:block;height:100%}
.sbar span{width:34px;text-align:right}
.vth{width:68px;height:56px;image-rendering:pixelated;background:linear-gradient(#5d79c9,#3c55a3);border-radius:6px;border:2px solid #9fb3ff;flex:none}
.face{width:36px;height:60px;image-rendering:pixelated;flex:none;background:#253671;border-radius:6px;border:2px solid #6f86c9}
.rk{display:inline-block;min-width:16px;text-align:center;border-radius:4px;font-size:11px;padding:0 3px;color:#111;margin-left:3px}
.rkE{background:#bbb}.rkD{background:#8fd18f}.rkC{background:#7fc3ff}.rkB{background:#c69bff}.rkA{background:#ffb04d}.rkS{background:#ff5e7e;color:#fff}
.surfbar{display:flex;height:9px;border-radius:3px;overflow:hidden;border:1px solid #000;margin:3px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:2px 8px;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.ebar{height:7px;background:#0d1330;border-radius:3px;overflow:hidden;border:1px solid #2c3b70;margin-top:2px}
.ebar i{display:block;height:100%;background:linear-gradient(90deg,#ffb347,#8ef58e)}
.sec-h{color:#ffd84a;margin:8px 0 5px;font-size:14px;border-bottom:1px dashed #6d84cf;padding-bottom:2px}
.note{background:#1a2550;border:1px solid #4b5ea0;border-radius:6px;padding:6px 8px;font-size:12px;color:#cfe0ff;margin-bottom:8px}
.trkcv{width:100%;aspect-ratio:200/84;background:#13182a;border-radius:6px;border:2px solid #4b5ea0}
.stand div{padding:1px 0}.stand .me{color:#ffd84a}
.big{font-size:22px;color:#ffd84a;text-align:center;margin:6px 0}
/* popup */
#pop{position:absolute;inset:0;z-index:80;background:rgba(5,8,18,.6);display:flex;align-items:center;justify-content:center;padding:14px}
#pop .pw{width:100%;max-width:400px;background:linear-gradient(#2d4185,#1e2b5c);border:3px solid #fff;border-radius:12px;box-shadow:0 0 0 3px #0b0f1c;max-height:88%;display:flex;flex-direction:column}
#pop .ph{color:#ffd84a;font-size:17px;padding:10px 12px 4px;text-align:center}
#pop .pb{padding:6px 14px;overflow-y:auto;line-height:1.45}
#pop .pf{display:flex;gap:8px;padding:10px 12px;justify-content:center;flex-wrap:wrap}
#pop textarea,#pop input[type=text]{width:100%;background:#0d1330;color:#fff;border:2px solid #6d84cf;border-radius:6px;font-family:inherit;padding:6px}
#pop textarea{height:110px;font-size:11px}
/* race */
#race{position:absolute;inset:0;z-index:50;background:#0b0f1c;display:flex;flex-direction:column}
#race .rhead{display:flex;justify-content:space-between;align-items:center;padding:6px 8px;background:linear-gradient(#26345f,#1b2547);border-bottom:2px solid #000;padding-top:calc(6px + env(safe-area-inset-top))}
#rTitle{color:#ffd84a;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
#rInfo{font-size:12px;text-align:right}
#rcv{width:100%;aspect-ratio:160/150;flex:none}
#rComm{padding:5px 8px;font-size:13px;background:#000;color:#fff;min-height:28px;border-top:2px solid #333;border-bottom:2px solid #333}
#rBoard{flex:1;overflow:hidden;padding:4px 8px;font-size:12px}
#rBoard .lr{display:flex;gap:6px;align-items:center;padding:1px 0}
#rBoard .lr.me{color:#ffd84a}
#rBoard .sw{width:9px;height:9px;border:1px solid #000;flex:none}
#rBoard .p{width:22px}
#rBoard .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#rCtl{padding:6px;background:#141a2e;border-top:2px solid #2b3963;display:flex;flex-direction:column;gap:5px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
#rCtl .r{display:flex;gap:4px}
#rCtl button{flex:1;padding:7px 2px;border-radius:7px;border:2px solid #4a5d9e;background:#1a2550;color:#cfe0ff;font-size:12px}
#rCtl button.on{background:#ffd84a;color:#2a1a00;border-color:#fff}
#rCtl button.sk{background:linear-gradient(#ffe684,#f2a81d);color:#3a2200;border-color:#7a4a00}
#rCtl button.rt{background:#5a1f2a;border-color:#c05060;color:#ffc9d0}
#rResult{position:absolute;inset:0;background:rgba(5,8,18,.82);display:flex;align-items:center;justify-content:center;padding:14px;z-index:5}
#rResult .pw{width:100%;max-width:400px;background:linear-gradient(#2d4185,#1e2b5c);border:3px solid #fff;border-radius:12px;padding:12px;max-height:94%;overflow-y:auto}
/* title */
#title{position:absolute;inset:0;z-index:90;background:radial-gradient(circle at 50% 30%,#2d4185,#0b0f1c);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;gap:10px;text-align:center}
#title h1{font-size:34px;margin:0;color:#ffd84a;text-shadow:3px 3px 0 #c0392b,6px 6px 0 #000;letter-spacing:1px;line-height:1.1}
#title .tag{color:#cfe0ff;font-size:13px}
#title canvas{width:min(92%,400px);aspect-ratio:200/60;border:3px solid #fff;border-radius:8px}
#title .colors{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
#title .colors button{width:30px;height:30px;border-radius:6px;border:3px solid #fff}
#title .colors button.on{outline:3px solid #ffd84a;outline-offset:2px}
#title input{background:#0d1330;color:#fff;border:2px solid #6d84cf;border-radius:7px;font-family:inherit;font-size:16px;padding:8px;width:min(92%,320px);text-align:center}
#title .box{display:flex;flex-direction:column;gap:10px;align-items:center;width:100%}

.stp{display:flex;align-items:center;gap:6px;background:#2c3d7c;border:1px solid #5a70bd;border-radius:7px;padding:5px 7px;margin-bottom:5px}
.stp .sv{min-width:62px;text-align:center;color:#ffd84a}
.ztab{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;font-size:11px;text-align:center}
.ztab div{background:#1c2754;border-radius:5px;padding:3px 1px;display:flex;flex-direction:column}
.ztab .zn{color:#9fb0d8;font-size:10px}
.benchcv{width:100%;aspect-ratio:160/100;border-radius:6px;border:2px solid #4b5ea0;background:#000}
.chartcv{width:100%;aspect-ratio:160/50;border-radius:6px;border:2px solid #4b5ea0;margin-bottom:6px}
.synccv{width:100%;aspect-ratio:160/70;border-radius:6px;border:2px solid #4b5ea0;margin-bottom:4px}
.dynocv{width:100%;aspect-ratio:160/90;border-radius:6px;border:2px solid #4b5ea0;margin-bottom:4px}
.plug{display:inline-block;width:14px;height:14px;border-radius:50%;border:2px solid #ddd}
input[type=range]{accent-color:#ffd84a;height:28px}
.laptop{background:#2b2f3a;border:3px solid #0b0d12;border-radius:10px 10px 3px 3px;padding:7px;margin-bottom:8px}
.lscreen{background:#eef1f5;color:#111;border:2px solid #000;border-radius:3px;padding:5px;font-size:11px}
.lbase{height:9px;background:linear-gradient(#5a606e,#3a3f4a);border-radius:0 0 12px 12px;margin:0 -14px}
.ltop{background:#1f4e8f;color:#fff;padding:2px 5px;margin:-5px -5px 4px;font-size:10px}
.ltabs{display:flex;gap:2px;margin-bottom:4px;flex-wrap:wrap}
.ltabs button{flex:1;background:#d5dae2;border:1px solid #8a93a3;border-radius:3px;padding:3px 2px;font-size:10px;color:#111}
.ltabs button.on{background:#fff;border-color:#1f4e8f;color:#1f4e8f;font-weight:bold}
.vegrid{display:grid;grid-template-columns:30px repeat(8,1fr);gap:1px;font-size:10px;user-select:none}
.vegrid .cell{text-align:center;padding:5px 0;color:#000;position:relative;cursor:pointer;border-radius:2px}
.vegrid .cell.sel{box-shadow:inset 0 0 0 2px #000;font-weight:bold}
.vegrid .ax{text-align:center;color:#334;font-size:9px;padding:5px 0}
.vegrid .lg{position:absolute;right:1px;top:1px;width:4px;height:4px;border-radius:50%}
.lg.ln{background:#c00}.lg.rc{background:#0040c0}.lg.kn{background:#ff00c8}
.lbar{display:flex;gap:2px;margin-top:4px;flex-wrap:wrap}
.lbar button{background:#d5dae2;border:1px solid #8a93a3;border-radius:3px;padding:4px 6px;font-size:11px;color:#111}
.lhint{background:#fffbe0;border:1px solid #c9b36a;color:#222;padding:3px 5px;margin-top:4px;font-size:10px;border-radius:3px}
.lscreen .stp{background:#dde3ec;border-color:#8a93a3;color:#111}.lscreen .stp .sub{color:#334}.lscreen .stp .sv{color:#1f4e8f}
.resume{display:flex;align-items:center;gap:8px;justify-content:space-between;border-color:#ffd84a}
#title .modes{display:flex;gap:6px;justify-content:center}
#title .modes button{background:#1a2550;color:#cfe0ff;border:2px solid #4a5d9e;border-radius:7px;padding:6px 12px;font-family:inherit}
#title .modes button.on{background:#ffd84a;color:#2a1a00;border-color:#fff}
.wtabs button{font-size:12px;padding:6px 3px}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="date" id="tDate"></span>
    <span class="st money" id="tMoney"></span>
    <span class="st rp" id="tRP"></span>
    <span class="st fans" id="tFans"></span>
    <span class="sp"><button data-s="0">⏸</button><button data-s="1">▶</button><button data-s="f" id="tFast">2×</button></span>
  </div>
  <div id="sceneWrap"><canvas id="scene"></canvas></div>
  <div id="ticker"></div>
  <div id="nextbar"></div>
  <div id="activity"></div>
  <div id="menu">
    <button data-m="race" id="mRace"><span class="ic">🏁</span><span class="tx">Races</span><span class="badge hidden">!</span></button>
    <button data-m="build"><span class="ic">🔧</span><span class="tx">Build</span></button>
    <button data-m="garage"><span class="ic">🚗</span><span class="tx">Garage</span></button>
    <button data-m="research"><span class="ic">🔬</span><span class="tx">Research</span></button>
    <button data-m="staff"><span class="ic">👥</span><span class="tx">Staff</span></button>
    <button data-m="sponsors" id="mSpon"><span class="ic">💼</span><span class="tx">Sponsors</span><span class="badge hidden">!</span></button>
    <button data-m="facility"><span class="ic">🏗️</span><span class="tx">Facility</span></button>
    <button data-m="team" id="mTeam"><span class="ic">📋</span><span class="tx">Team</span><span class="badge hidden">!</span></button>
  </div>
  <div id="ov" class="ov hidden"><div class="win">
    <div class="whead"><button class="wback hidden" id="wback">◀</button><span class="wtitle" id="wtitle"></span><button class="wclose" id="wclose">✕</button></div>
    <div class="wtabs" id="wtabs"></div>
    <div class="wbody" id="wbody"></div>
  </div></div>
  <div id="race" class="hidden">
    <div class="rhead"><div id="rTitle"></div><div id="rInfo"></div></div>
    <canvas id="rcv"></canvas>
    <div id="rComm"></div>
    <div id="rBoard"></div>
    <div id="rCtl"></div>
    <div id="rResult" class="hidden"></div>
  </div>
  <div id="pop" class="hidden"></div>
  <div id="toast"></div>
  <div id="title">
    <h1>TOP<br>PRIX</h1>
    <div class="tag">Motorsport team manager · cars &amp; bikes · tarmac &amp; dirt</div>
    <canvas id="tcv"></canvas>
    <div class="box" id="tbox"></div>
  </div>
</div>
<script>// ===================== GRID & GRAVEL — CONTENT DATA =====================
const D = {};

D.RANKS = ['E','D','C','B','A','S'];
D.RANK_WS = {E:1,D:1,C:2,B:3,A:4,S:4};
D.RANK_REQ = {E:30,D:70,C:150,B:260,A:420,S:640}; // team tech needed for full-quality build

// Surfaces -> which terrain stat they test
D.SURF = {
  tar:{n:'Tarmac',k:'on',col:'#7d7f87',dmg:0.8,risk:0.8},
  wet:{n:'Wet',k:'wet',col:'#4f6f8f',dmg:1.0,risk:1.35},
  dirt:{n:'Dirt',k:'off',col:'#a2683a',dmg:1.15,risk:1.1},
  sand:{n:'Sand',k:'off',col:'#d9b45c',dmg:1.25,risk:1.15},
  mud:{n:'Mud',k:'off',col:'#6b4a2b',dmg:1.45,risk:1.35},
  snow:{n:'Snow',k:'ice',col:'#e3ecf5',dmg:1.0,risk:1.3},
  ice:{n:'Ice',k:'ice',col:'#a9dcf0',dmg:1.05,risk:1.55},
};
D.TERR_N = {on:'On-Rd',off:'Off-Rd',wet:'Wet',ice:'Icy'};

// Section types: weights [spd,acc,hnd], damage, base mistake risk
D.SEC = {
  str:{n:'Straight',w:[0.75,0.2,0.05],dmg:0.35,risk:0.004},
  crv:{n:'Sweeper',w:[0.4,0.15,0.45],dmg:0.55,risk:0.012},
  hp:{n:'Hairpin',w:[0.05,0.45,0.5],dmg:0.6,risk:0.022},
  chi:{n:'Chicane',w:[0.1,0.4,0.5],dmg:0.65,risk:0.02},
  jmp:{n:'Jump',w:[0.3,0.3,0.4],dmg:1.6,risk:0.03},
  rgh:{n:'Rough',w:[0.2,0.3,0.5],dmg:1.5,risk:0.026},
  hill:{n:'Climb',w:[0.3,0.6,0.1],dmg:0.6,risk:0.008},
};
D.STYLES = {

D.formats = (r)=>{
  const L=r.laps;const st=r.style;
  if(st==='drag')return[{id:'elim',n:'Eliminations (8-car ladder)',kind:'drag',laps:1,mul:{prize:1,rp:1,fans:1,wear:1}}];
  if(st==='hill')return[{id:'best2',n:'2 runs — best time counts',kind:'tt',runs:2,laps:1,mul:{prize:1.15,rp:1.2,fans:1.1,wear:1.6}},{id:'one',n:'Single run',kind:'tt',runs:1,laps:1,mul:{prize:1,rp:1,fans:1,wear:1}}];
  if(st==='rally'||st==='desert')return[{id:'stage',n:'Single stage',kind:'tt',laps:1,mul:{prize:1,rp:1,fans:1,wear:1}},{id:'rally3',n:'3-stage rally',kind:'tt',laps:3,mul:{prize:2.2,rp:2,fans:1.8,wear:2.6}}];
  if(st==='enduro')return[{id:'one',n:`Hare scramble (${L} lap${L>1?'s':''})`,kind:'mass',laps:L,mul:{prize:1,rp:1,fans:1,wear:1}},{id:'long',n:`Long scramble (${L*2} laps)`,kind:'mass',laps:L*2,mul:{prize:1.7,rp:1.6,fans:1.5,wear:2}}];
  const out=[{id:'sprint',n:`Sprint — ${L} lap${L>1?'s':''}`,kind:'mass',laps:L,mul:{prize:1,rp:1,fans:1,wear:1}},
    {id:'feature',n:`Feature — ${L*2} laps`,kind:'mass',laps:L*2,mul:{prize:1.6,rp:1.5,fans:1.5,wear:1.8}}];
  if(st==='mx'||st==='oval'||st==='mixed')out.push({id:'heats',n:`Heats + Main (${Math.max(1,Math.ceil(L/2))}-lap heats, ${L+1}-lap main)`,kind:'heats',laps:L+1,heatLaps:Math.max(1,Math.ceil(L/2)),mul:{prize:1.35,rp:1.5,fans:1.6,wear:1.6}});

};

// ===================== UTIL =====================
const U = {
  clamp:(v,a,b)=>Math.max(a,Math.min(b,v)),
  rand:(a,b)=>a+Math.random()*(b-a),
  ri:(a,b)=>Math.floor(a+Math.random()*(b-a+1)),
  pick:arr=>arr[Math.floor(Math.random()*arr.length)],
  chance:p=>Math.random()<p,
  shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;},
  seeded(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};},
  hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;},
  money(v){const a=Math.abs(v),s=v<0?'-':'';if(a>=1e6)return s+'$'+(a/1e6).toFixed(a>=1e8?0:a>=1e7?1:2)+'M';if(a>=1e3)return s+'$'+Math.round(a/1e3)+'K';return s+'$'+Math.round(a);},
  num(v){if(v>=1e6)return(v/1e6).toFixed(1)+'M';if(v>=1e4)return(v/1e3).toFixed(1)+'K';return String(Math.round(v));},
  esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));},
  ord(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0]);},
  sum:(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0),
  stars(n,max=5){let s='';for(let i=0;i<max;i++)s+=i<n?'★':'☆';return s;},
};

// ===================== ENGINE & FUEL MODEL =====================
const T = {};
T.has = id=>!!(G.tech&&G.tech[id]);
T.mode = ()=>(G&&G.settings&&G.settings.mode)||'standard';
T.T0 = 288.15;
T.press = alt=>Math.pow(1-2.25577e-5*alt,5.25588);
T.dens = (alt,temp)=>T.press(alt)*(T.T0/(273.15+temp));
T.forecast = (r,day=G.day)=>{
  const c=D.condOf(r);const m=Math.floor((day%D.DAYS_YEAR)/D.DAYS_MONTH);const rng=U.seeded(U.hash(r.id)+Math.floor(day/7)*31);
  const sw=T.mode()==='sim'?7:3;const temp=Math.round(c.temp+D.SEASON[m]*(c.temp<0?0.5:1)+(rng()*2-1)*sw);
  return {alt:c.alt,alt2:c.alt2,temp,tod:c.tod,rho:T.dens(c.alt,temp),rho2:T.dens(c.alt2,temp-(c.alt2-c.alt)*0.0065),name:r.n};
};
T.SHOP = ()=>({alt:200,alt2:200,temp:20,tod:'day',rho:T.dens(200,20),rho2:T.dens(200,20),name:'Shop (200 m, 20°C)'});
T.cyl = v=>D.LAYOUT_CYL[v.layout]==null?4:D.LAYOUT_CYL[v.layout];
T.isBike = v=>D.BODY[v.body].cls==='bike';
T.dirtKind = k=>['trail','mx','enduro','raid','smoto','flat'].includes(k);
T.nCarbs = v=>{if(!v.eng||v.eng.fuel==='none')return 0;if(v.eng.fuel==='efi')return T.isBike(v)?T.cyl(v):1;const C=D.CARBS[v.eng.carb];return C.cls==='car'?(C.carbs||1):T.cyl(v);};
T.syncBase = n=>n>=3?1:0;
T.carbsFor = v=>Object.entries(D.CARBS).filter(([k,c])=>c.cls===D.BODY[v.body].cls).map(([k])=>k);
T.carbAvail = id=>{const c=D.CARBS[id];return c.un==='S'||T.has(c.un);};
T.defaultCarb = (cls,lid)=>cls==='car'?'d2':'pe';
T.efiCost = b=>Math.max(20000,Math.round(b.cost*0.25/1000)*1000);
T.carbSwapCost = (b,id)=>Math.max(8000,Math.round(b.cost*({pe:0.05,cv:0.06,pwk:0.08,fcr:0.14,d2:0.05,q4:0.09,dcoe:0.15}[id]||0.08)/1000)*1000);

// ---------- init / migrate ----------
T.initEng = (v,sys)=>{
  const cyl=T.cyl(v);
  if(cyl===0){v.eng={fuel:'none',cond:1,fuelT:'pump',timing:0,sync:[]};return v.eng;}
  const e=v.eng={fuel:sys&&sys.type==='efi'?'efi':'carb',carb:(sys&&sys.carb)||T.defaultCarb(D.BODY[v.body].cls,v.layout),jets:{},timing:0,fuelT:'pump',cond:1,log:null,sync:[]};
  T.stockJets(v);
  const n=T.nCarbs(v);const rng=U.seeded(v.id*131+7);e.sync=Array.from({length:n},(_,i)=>i===T.syncBase(n)?0:+((rng()*2-1)*0.8).toFixed(1));
  if(e.fuel==='efi')T.initEFI(v);
  return e;
};
T.stockJets = v=>{const C=D.CARBS[v.eng.carb];v.eng.jets={};for(const p of C.p)v.eng.jets[p.k]=p.stock;};
T.initEFI = v=>{
  const tv=T.trueVE(v);const rng=U.seeded(v.id*977+3);
  v.eng.efi={ve:tv.map(r=>r.map(x=>Math.round(x*(1+(rng()*2-1)*0.11)))),ign:[],afr:D.LOAD_B.map((l,j)=>D.RPM_B.car.map(()=>D.AFR_DEF[j])),ae:100,edits:0};
  for(let j=0;j<6;j++){v.eng.efi.ign.push([]);for(let i=0;i<8;i++)v.eng.efi.ign[j].push(Math.round(T.mbt(i,j)-4));}
  const n=T.nCarbs(v);v.eng.sync=Array.from({length:n},(_,i)=>i===T.syncBase(n)?0:+((rng()*2-1)*0.6).toFixed(1));
};

// ---------- hidden engine requirement ----------
T.need = v=>{
  const rng=U.seeded(v.id*9973+U.hash(v.body));const b=z=>1+(rng()-0.5)*0.08;
  const n={idle:b(),low:b(),mid:b(),wot:b(),trans:1+(rng()-0.5)*0.12};
  for(const pid of v.parts){const P=D.PART[pid];if(!['exh','ful','eng'].includes(P.cat))continue;const t=P.tier+1;
    n.wot+=0.014*t;n.mid+=0.008*t;n.low+=0.003*t;n.trans+=0.006*t;if(pid==='nitrous')n.wot+=0.05;if(pid.includes('turbo'))n.wot+=0.03,n.mid+=0.02;}
  if(T.has('porting')){n.wot+=0.03;n.mid+=0.02;}
  if(T.has('bigvalve')){n.wot+=0.06;n.mid+=0.02;}
  return n;
};
T.aeNeed = v=>Math.round(100*T.need(v).trans);
T.trueVE = v=>{
  const nd=T.need(v);const rng=U.seeded(v.id*31337+5);const pk=4.2+rng()*1.6+(v.parts.some(p=>D.PART[p].cat==='eng')?0.6:0);
  const out=[];for(let j=0;j<6;j++){out.push([]);const L=D.LOAD_B[j];const zn=j>=4?nd.wot:j>=2?nd.mid:nd.low;
    for(let i=0;i<8;i++){const bell=Math.exp(-Math.pow((i-pk)/2.6,2));out[j].push((48+44*bell)*(0.78+0.22*L/100)*zn*(1+(rng()-0.5)*0.05));}}
  return out;
};
T.mbt = (i,j)=>14+2.4*i+(100-D.LOAD_B[j])*0.17;
T.kl = (v,i,j,lam,cond)=>{
  const L=D.LOAD_B[j];let m=6+(100-L)*0.15+i*0.6-(L>=90&&i<=2?4:0);
  m+=D.FUELS[v.eng.fuelT||'pump'].kn-(T.has('highcomp')?3:0)+cond.alt/1000*1.5-(cond.temp-20)*0.12;
  if(lam>0.9)m-=(lam-0.9)*50;if(lam<0.85)m+=(0.85-lam)*20;
  return T.mbt(i,j)+m;
};
// cell weights per zone
T.ZC = {
  idle:[[0,0,1]],
  low:[[0,1,1],[0,2,1],[0,3,0.6],[1,1,1],[1,2,1],[1,3,0.8]],
  mid:[[2,2,1],[2,3,1],[2,4,1],[2,5,0.7],[3,2,1],[3,3,1],[3,4,1],[3,5,0.8],[3,6,0.5]],
  wot:[[4,2,0.6],[4,3,0.9],[4,4,1],[4,5,1.1],[4,6,1.1],[4,7,1],[5,2,0.6],[5,3,0.9],[5,4,1],[5,5,1.2],[5,6,1.2],[5,7,1.1]],
};

// ---------- carb richness ----------
T.carbRich = v=>{
  const C=D.CARBS[v.eng.carb];const j=v.eng.jets;const R={idle:1,low:1,mid:1,wot:1,trans:1};
  for(const p of C.p){const val=j[p.k];if(val==null)continue;
    if(p.t==='jet'){for(const z of D.ZONES)R[z]*=Math.pow(val/p.stock,2*p.w[z]);R.trans*=Math.pow(val/p.stock,2*p.w.low);}
    else if(p.t==='lin'||p.t==='clip'){for(const z of D.ZONES)R[z]*=1+p.w[z]*(val-p.stock);R.trans*=1+p.w.low*(val-p.stock);}
    else if(p.t==='pv'){R.mid*=1+0.03*(val-p.stock);R.trans*=1+0.01*(val-p.stock);}
    else if(p.t==='airc'){R.wot*=Math.pow(p.stock/val,0.8);R.mid*=Math.pow(p.stock/val,0.2);}
    else if(p.t==='pump'){R.trans*=Math.pow(val/p.stock,0.8);}
  }
  R.trans*=C.trans;return R;
};

// ---------- full evaluation for one condition (rho/temp/alt) ----------
T.pf = (lam,z)=>{const t=D.LAM[z]||0.88;const w={idle:0.3,low:0.5,mid:0.9,wot:1,trans:0.6}[z];
  let loss=lam<t?4.5*Math.pow(t-lam,2):5*Math.pow(lam-t,2);if(lam>1.12)loss+=(lam-1.12)*1.5;if(lam<0.72)loss+=(0.72-lam)*1.2;return Math.max(0.4,1-loss*w);};
T.tf = (adv,mbt)=>{const r=mbt-adv;return r>0?1-0.0005*r*r:1-0.0008*r*r;};
T.eval = (v,cond,rhoOverride)=>{
  const e=v.eng;const out={lam:{},pf:{},tf:{},kd:{},lh:{},ef:{},cells:null,notes:[]};
  if(!e||e.fuel==='none'){for(const z of[...D.ZONES,'trans']){out.lam[z]=D.LAM[z]||0.9;out.ef[z]=1;out.kd[z]=0;out.lh[z]=0;}return out;}
  const rho=rhoOverride!=null?rhoOverride:cond.rho;const tK=273.15+cond.temp;const press=rho*tK/T.T0;
  const nd=T.need(v);const n=T.nCarbs(v);
  // sync
  const bi=T.syncBase(n);const offs=e.sync.filter((x,i)=>i!==bi);const imb=offs.length?U.sum(offs,x=>Math.abs(x))/offs.length:0;out.imb=imb;
  const sF={idle:1-0.04*imb,low:1-0.025*imb,mid:1-0.008*imb,wot:1-0.003*imb,trans:1-0.025*imb};
  let pw=D.FUELS[e.fuelT||'pump'].pw*(T.has('porting')?1.03:1)*(T.has('highcomp')?1.04:1)*(0.86+0.14*U.clamp(e.cond,0,1));
  const ve=e.fuel==='efi'?e.efi.ve:null;
  if(e.fuel==='carb'){const C=D.CARBS[e.carb];pw*=C.pw;const R=T.carbRich(v);const fn=D.FUELS[e.fuelT||'pump'].need;
    for(const z of D.ZONES)out.lam[z]=D.LAM[z]*nd[z]*fn/R[z]*Math.sqrt(rho);
    out.lam.trans=D.LAM.low*nd.trans*fn/R.trans*Math.sqrt(rho);
  }else{pw*=1.05;const tv=T.trueVE(v);const comp=(T.has('mapsens')?1:press)*(T.has('iat')?1:T.T0/tK);
    out.cells=[];for(let j=0;j<6;j++){out.cells.push([]);for(let i=0;i<8;i++){out.cells[j].push(e.efi.afr[j][i]/14.7*tv[j][i]/Math.max(5,ve[j][i])*comp);}}
    for(const z of D.ZONES){let s=0,w=0;for(const[j,i,ww]of T.ZC[z]){s+=out.cells[j][i]*ww;w+=ww;}out.lam[z]=s/w;}
    out.lam.trans=out.lam.low*Math.pow(T.aeNeed(v)/Math.max(10,e.efi.ae),0.6);}
  // power, timing & knock per zone
  for(const z of D.ZONES){let pf=0,tf=0,kd=0,kmax=0,w=0;
    for(const[j,i,ww]of T.ZC[z]){const lam=out.cells?out.cells[j][i]:out.lam[z];const mbt=T.mbt(i,j);
      const adv=e.fuel==='efi'?e.efi.ign[j][i]:mbt-3+(e.timing||0);const k=Math.max(0,adv-T.kl(v,i,j,lam,cond));
      pf+=T.pf(lam,z)*ww;tf+=T.tf(adv,mbt)*ww;kd+=k*ww;kmax=Math.max(kmax,k);w+=ww;}
    out.pf[z]=pf/w;out.tf[z]=tf/w;out.kd[z]=(z==='mid'||z==='wot')?kd/w*0.5+kmax*0.5:0;
    out.lh[z]=(z==='mid'||z==='wot')?Math.max(0,out.lam[z]-0.97)*40:0;
    if(e.fuel==='efi'&&T.has('knock')&&out.kd[z]>0){out.tf[z]*=1-0.01*out.kd[z];out.kd[z]*=0.15;}
    out.ef[z]=out.pf[z]*out.tf[z]*sF[z]*pw;}
  out.pf.trans=T.pf(out.lam.trans,'trans');out.ef.trans=out.pf.trans*sF.trans*pw;out.kd.trans=0;out.lh.trans=0;
  // float effects
  const fl=e.fuel==='carb'?(e.jets.float||0):0;out.starve=fl<=-1.5&&!T.has('baffle');out.flood=fl>=1.5&&!T.has('baffle');
  out.foul=out.lam.idle<0.78||out.lam.low<0.76;out.seize=v.layout==='stroke2'&&out.lam.wot>0.93;
  return out;
};
T.afr = lam=>lam*14.7;
T.zoneLabel = (lam,z)=>{const t=D.LAM[z]||0.88;const d=lam-t;return Math.abs(d)<0.02?['On target','#8ef58e']:d<0?(d<-0.06?['Very rich','#ff9a5c']:['Rich','#ffd84a']):(d>0.06?['Very lean','#ff5c5c']:['Lean','#ffd84a']);};
T.plug = lam=>lam<0.8?['Sooty black','#1c1c1c','Rich']:lam<0.845?['Dark brown','#5a3b1c','Slightly rich']:lam<0.905?['Light tan','#c79a5a','Good']:lam<0.96?['Grey-white','#c9c9c0','Slightly lean']:['Chalk white, blistered','#f4f4f4','LEAN!'];
T.symptoms = (ev,efi)=>{const s=[];const L=ev.lam,t=D.LAM;
  if(L.idle>t.idle+0.07)s.push(efi?'Hangs at idle and pops on decel (lean low-load cells)':'Hangs at idle and pops on decel (lean pilot circuit)');else if(L.idle<t.idle-0.1)s.push(efi?'Sooty idle (rich low-load cells)':'Blubbery, sooty idle (rich pilot circuit)');
  if(L.trans>t.low+0.05)s.push(efi?'Bogs on throttle snaps — more accel enrichment':'Bogs when you snap the throttle (lean transition)');
  if(L.mid>t.mid+0.06)s.push(efi?'Surges at part throttle (lean mid cells)':'Surges at part throttle (lean needle)');else if(L.mid<t.mid-0.07)s.push(efi?'Dull midrange (rich mid cells)':'Dull midrange, black smoke (rich needle)');
  if(L.wot>t.wot+0.06)s.push(efi?'Pulls then flattens — lean WOT cells':'Pulls hard then flattens; pinging under load (lean main)');else if(L.wot<t.wot-0.06)s.push(efi?'Soggy top end (rich WOT cells)':'Black smoke and soggy top end (rich main)');
  if(ev.kd.wot>0.5||ev.kd.mid>0.5)s.push('Audible pinging — detonation!');
  if(ev.imb>1.2)s.push('Rough, lumpy idle — carbs out of sync');
  if(!s.length)s.push('Crisp and clean everywhere');return s;};

// ---------- race section factors ----------
T.SECZ = {str:{wot:1},hill:{wot:0.6,mid:0.4},crv:{mid:0.8,wot:0.2},jmp:{mid:0.5,wot:0.5},hp:{low:0.6,trans:0.4},chi:{low:0.5,trans:0.5},rgh:{low:0.5,mid:0.5},lau:{trans:0.5,low:0.2,wot:0.3}};
T.setupMul = (v,sec)=>{
  const st=v.setup||{};const b=D.BODY[v.body];const bike=b.cls==='bike';const off=D.SURF[sec.surf].k==='off'||sec.type==='rgh'||sec.type==='jmp';
  let g=1;if(T.has('gearing')){if(bike&&st.f)g=(st.r/st.f)/T.stockRatio(v);else if(!bike&&st.fd)g=st.fd/3.7;}
  let S=Math.pow(g,-0.5),A=Math.pow(g,0.6),H=1,tm=1;
  if(T.has('adjsus')&&st.susp!=null){const c=st.susp-5;H*=off?1-0.015*c:1+0.012*c;}
  if(T.has('tirepress')&&st.psi!=null){const sp=T.stockPsi(v);const d=(st.psi-sp)/sp;tm*=off?1-0.35*d-0.6*d*d:1+0.25*d-0.9*d*d;}
  if(!bike&&T.has('aero')&&st.wing!=null){const w=st.wing-5;if(sec.type==='str')S*=1-0.004*w;else if(sec.type!=='lau')H*=1+0.006*w;}
  return {S,A,H,tm};
};
T.stockRatio = v=>T.dirtKind(D.BODY[v.body].kind)?47/13:45/16;
T.stockPsi = v=>{const b=D.BODY[v.body];return b.cls==='car'?32:T.dirtKind(b.kind)?14:34;};
T.defaultSetup = v=>{const b=D.BODY[v.body];return b.cls==='bike'?(T.dirtKind(b.kind)?{f:13,r:47,susp:5,psi:14}:{f:16,r:45,susp:5,psi:34}):{fd:3.7,susp:5,psi:32,wing:5};};
T.evalIdeal = v=>{const e=v.eng;const out={lam:{...D.LAM,trans:D.LAM.low},ef:{},kd:{},lh:{},imb:0};let pw=1;if(e&&e.fuel!=='none'){pw=D.FUELS[e.fuelT||'pump'].pw*(T.has('porting')?1.03:1)*(T.has('highcomp')?1.04:1)*(0.86+0.14*U.clamp(e.cond,0,1))*(e.fuel==='efi'?1.05:D.CARBS[e.carb].pw);}
  for(const z of[...D.ZONES,'trans']){out.ef[z]=pw*0.995;out.kd[z]=0;out.lh[z]=0;}return out;};
T.raceSecs = (v,def,tr,cond,ideal)=>{
  const out=[];const hill=cond.alt2!==cond.alt;const cache={};
  const evAt=frac=>{if(ideal)return cache.i||(cache.i=T.evalIdeal(v));const key=hill?Math.round(frac*4):0;if(cache[key])return cache[key];const alt=cond.alt+(cond.alt2-cond.alt)*(key/4);
    const temp=cond.temp-(alt-cond.alt)*0.0065;return cache[key]=T.eval(v,{...cond,alt,temp},T.dens(alt,temp));};
  const easy=T.mode()==='easy';const efi=v.eng&&v.eng.fuel==='efi';
  for(const sec of tr.secs){const ev=evAt((sec.at+sec.len/2)/tr.lapLen);const zw=T.SECZ[sec.type]||{wot:1};let ef=0,kd=0,lh=0,lam=0;
    for(const z in zw){ef+=zw[z]*ev.ef[z];kd+=zw[z]*(ev.kd[z]||0);lh+=zw[z]*(ev.lh[z]||0);lam+=zw[z]*ev.lam[z];}
    if(sec.type==='lau'&&efi&&T.has('launch'))ef*=1.08;
    const sm=T.setupMul(v,sec);
    out.push({ef,s:sm.S,a:sm.A,h:sm.H,t:sm.tm,kd:easy?0:kd,lh:easy?0:lh,lam,starve:!easy&&ev.starve&&(sec.type==='jmp'||sec.type==='rgh'),flood:!easy&&ev.flood&&sec.type==='rgh',
      smoke:lam<0.8?'rich':(ev.lam.idle>1.0||ev.lam.low>0.97)&&(sec.type==='hp'||sec.type==='chi')?'pop':null});}
  const ev0=evAt(0);return {secs:out,ev:ev0,foul:!easy&&ev0.foul,seize:!easy&&ev0.seize};
};

// ---------- crew tune (optimizer) ----------
T.err = (v,cond)=>{let s=0;const hill=cond.alt2!==cond.alt;const pts=hill?[0,0.5,1]:[0];
  for(const f of pts){const alt=cond.alt+(cond.alt2-cond.alt)*f;const temp=cond.temp-(alt-cond.alt)*0.0065;const ev=T.eval(v,{...cond,alt,temp},T.dens(alt,temp));
    for(const z of D.ZONES)s+=({idle:0.4,low:0.8,mid:1.2,wot:1.6}[z])*Math.pow(ev.lam[z]-D.LAM[z],2)+(ev.lam[z]>D.LAM[z]?0.5*Math.pow(ev.lam[z]-D.LAM[z],2):0);
    s+=0.6*Math.pow(ev.lam.trans-D.LAM.low,2)+0.02*(ev.kd.wot+ev.kd.mid);}
  return s;};
T.crewTune = (v,cond,q=0.97)=>{
  const e=v.eng;if(!e||e.fuel==='none')return;
  if(e.fuel==='carb'){const C=D.CARBS[e.carb];e.jets.float=0;
    for(let it=0;it<4;it++)for(const p of C.p){if(p.k==='float')continue;let best=e.jets[p.k],bs=T.err(v,cond);
      for(let x=p.min;x<=p.max+1e-9;x+=p.step){e.jets[p.k]=+x.toFixed(2);const s=T.err(v,cond);if(s<bs-1e-9){bs=s;best=e.jets[p.k];}}e.jets[p.k]=best;}
    // timing: as far as safe
    let bt=-6;for(let t=-6;t<=8;t++){e.timing=t;const ev=T.eval(v,cond);if(ev.kd.wot<=0&&ev.kd.mid<=0)bt=t;}e.timing=Math.max(-6,bt-1);
    if(U.chance((1-q)*8)){const p=C.p[0];e.jets[p.k]=+U.clamp(e.jets[p.k]+(U.chance(0.5)?1:-1)*p.step,p.min,p.max).toFixed(2);}
  }else{const tv=T.trueVE(v);const tK=273.15+cond.temp;const rho=cond.alt2!==cond.alt?T.dens((cond.alt+cond.alt2)/2,cond.temp):cond.rho;const press=rho*tK/T.T0;
    const comp=(T.has('mapsens')?1:press)*(T.has('iat')?1:T.T0/tK);
    for(let j=0;j<6;j++)for(let i=0;i<8;i++){e.efi.afr[j][i]=D.AFR_DEF[j];
      e.efi.ve[j][i]=Math.round(tv[j][i]*comp*(1+(U.rand(-1,1))*(1-q)*0.6));
      const lam=e.efi.afr[j][i]/14.7;e.efi.ign[j][i]=Math.round(Math.min(T.mbt(i,j),T.kl(v,i,j,lam,cond)-1.5));}
    e.efi.ae=T.aeNeed(v);}
  const n=e.sync.length,bi=T.syncBase(n);e.sync=e.sync.map((x,i)=>i===bi?0:+(U.rand(-1,1)*(1-q)*3).toFixed(1));
  e.tunedFor=cond.name;
};
T.crewCost = ()=>Math.round((6000+G.ws*G.ws*6000)/1000)*1000;
T.rebuildCost = v=>Math.round(D.BODY[v.body].cost*0.12*(1-v.eng.cond+0.2)/1000)*1000;

// ---------- logging ----------
T.makeLog = (v,cond,src)=>{const ev=T.eval(v,cond);return {d:G.day,src,cond:cond.name,lam:{...ev.lam},kd:{...ev.kd},imb:ev.imb||0,cells:ev.cells?ev.cells.map(r=>r.slice()):null,wb:T.has('wideband')};};

// ---------- staff generation ----------

  const s={id:E.nid(),role,name:U.pick(D.FIRST)+' '+U.pick(D.LAST),hair:U.pick(D.HAIR),skin:U.pick(D.SKIN),

// ---------- vehicles ----------
E.partClsOk = (p,cls)=>p.cls==='A'||(p.cls==='C'&&cls==='car')||(p.cls==='B'&&cls==='bike');
E.partLv = pid=>(G.partLv[pid]||{lv:1}).lv;
E.vs = v=>{
  const b=D.BODY[v.body]; const s={spd:v.base.spd+v.upAdd.spd,acc:v.base.acc+v.upAdd.acc,hnd:v.base.hnd+v.upAdd.hnd,dur:v.base.dur+v.upAdd.dur};
  const t={...v.terr}; let adv=b.adv; const fx={rp:0,mis:1,wear:1,fan:0};
  for(const pid of v.parts){const P=D.PART[pid];const lm=1+0.1*(E.partLv(pid)-1);
    for(const k in P.st){if(k in s)s[k]+=P.st[k]*lm;else if(k in t)t[k]+=P.st[k];else if(k==='adv')adv+=P.st[k];}
    if(P.fx.rp)fx.rp+=P.fx.rp;if(P.fx.mis)fx.mis*=P.fx.mis;if(P.fx.wear)fx.wear*=P.fx.wear;if(P.fx.fan)fx.fan+=P.fx.fan;}

};
E.sysCost = (bid,lid,sys)=>{if(!sys||D.LAYOUT_CYL[lid]===0)return 0;const b=D.BODY[bid];if(sys.type==='efi')return T.efiCost(b);const def=T.defaultCarb(b.cls,lid);return sys.carb&&sys.carb!==def?T.carbSwapCost(b,sys.carb):0;};
E.vehCost = (bid,lid)=>Math.round(D.BODY[bid].cost*(1+D.LAYOUT[lid].cm)/1000)*1000;
E.buildQ = (bid)=>U.clamp(E.teamTech()/D.RANK_REQ[D.BODY[bid].rank],0.45,1.6);

E.finishBuild = v=>{
  const b=D.BODY[v.body],L=D.LAYOUT[v.layout];const qm=E.qMult(v.q);

E.upCost = (v,k)=>Math.round(D.BODY[v.body].cost*0.12*Math.pow(v.up[k]+1,1.35)/1000)*1000;
E.startUpgrade = (vid,k,spark)=>{
  const v=E.veh(vid);if(!v||v.status!=='ready')return false;if(v.up[k]>=5)return false;if(!E.canStartJob())return false;
  const c=E.upCost(v,k);if(G.money<c){E.H.toast('Not enough money');return false;}
  if(spark&&!E.useSpark(spark))return false;
  G.money-=c;v.status='upgrade';
  const days=4+2*v.up[k];G.jobs.push({id:E.nid(),type:'up',vid,k,left:days,total:days,req:D.RANK_REQ[D.BODY[v.body].rank],spark:spark||null});
  E.say(`Upgrading ${v.name}: ${k.toUpperCase()}`);E.H.sfx('click');return true;
};
E.finishUpgrade = (v,job)=>{
  const b=D.BODY[v.body];const k=job.k;const q=U.clamp(E.teamTech()/job.req,0.45,1.6);
  const fb={spd:E.facV('bSpd'),acc:E.facV('bAcc'),hnd:E.facV('bHnd'),dur:E.facV('bDur')}[k];
  const sm=job.spark?{b:1.5,s:2,g:3}[job.spark]:1;
  const gain=Math.max(1,Math.round((b.s[k]*0.085+3)*(0.8+0.25*q)*(1+fb/100)*sm*U.rand(0.9,1.15)));
  v.upAdd[k]+=gain;v.up[k]++;v.status='ready';
  E.say(`${v.name}: ${k.toUpperCase()} +${gain}`);E.H.float(`${k.toUpperCase()} +${gain}`,v.id,'#7f7');E.H.sfx('good');
};
E.partCost = pid=>Math.round(D.PART[pid].cost*(1-E.facV('partdisc')/100)/1000)*1000;
E.installPart = (vid,pid)=>{
  const v=E.veh(vid),P=D.PART[pid],b=D.BODY[v.body];if(!v||!G.res.part[pid]||!E.partClsOk(P,b.cls))return false;
  if(v.status==='build'){E.H.toast('Still being built');return false;}
  if(v.parts.includes(pid))return false;
  const same=v.parts.find(x=>D.PART[x].cat===P.cat);
  if(!same&&v.parts.length>=b.slots){E.H.toast('No free part slots');return false;}
  const c=E.partCost(pid);if(G.money<c){E.H.toast('Not enough money');return false;}
  G.money-=c;if(same)v.parts=v.parts.filter(x=>x!==same);v.parts.push(pid);
  E.say(`Installed ${P.n} on ${v.name}`);E.H.float(P.n,v.id,'#9cf');E.H.sfx('good');return true;
};
E.removePart = (vid,pid)=>{const v=E.veh(vid);if(!v)return;v.parts=v.parts.filter(x=>x!==pid);};
E.rushCost = v=>Math.round((1-v.hp)*D.BODY[v.body].cost*0.3/1000+1)*1000;
E.rushRepair = vid=>{const v=E.veh(vid);if(!v||v.status!=='repair')return false;const c=E.rushCost(v);
  if(G.money<c){E.H.toast('Not enough money');return false;}G.money-=c;G.jobs=G.jobs.filter(j=>j.vid!==vid);v.hp=1;v.status='ready';
  E.say(`${v.name} rush-repaired`);E.H.sfx('good');return true;};
E.sellValue = v=>Math.round((v.cost*0.4+U.sum(v.parts,p=>D.PART[p].cost*0.25))/1000)*1000;
E.scrapRP = v=>Math.round(D.BODY[v.body].rp*0.3+v.races*2+5);
E.removeVehicle = vid=>{G.vehicles=G.vehicles.filter(v=>v.id!==vid);G.jobs=G.jobs.filter(j=>j.vid!==vid);};
E.sell = vid=>{const v=E.veh(vid);if(!v||v.status==='build')return false;const m=E.sellValue(v);G.money+=m;E.removeVehicle(vid);E.say(`Sold ${v.name} for ${U.money(m)}`);return true;};
E.scrap = vid=>{const v=E.veh(vid);if(!v||v.status==='build')return false;const r=E.scrapRP(v);G.rp+=r;E.removeVehicle(vid);E.say(`Scrapped ${v.name}: +${r} RP`);return true;};

// ---------- sparks ----------
E.useSpark = t=>{if(!G.sparks[t]){E.H.toast('No spark of that kind');return false;}G.sparks[t]--;return true;};
E.giveSpark = (t,why)=>{G.sparks[t]++;const n={b:'Bronze',s:'Silver',g:'Gold'}[t];E.say(`Got a ${n} Spark! ${why||''}`);};

// ---------- staff actions ----------
E.hire = cid=>{
  const c=G.cand.find(x=>x.id===cid);if(!c)return false;
  const W=E.ws(); if(c.role==='drv'&&E.drivers().length>=W.teams+1){E.H.toast(`Driver limit (${W.teams+1}) — upgrade workshop`);return false;}
  if(c.role==='mec'&&E.mechs().length>=W.mech){E.H.toast(`Mechanic limit (${W.mech}) — upgrade workshop`);return false;}
  const fee=c.salary*3;if(G.money<fee){E.H.toast('Not enough money');return false;}
  G.money-=fee;c.joined=G.day;G.staff.push(c);G.cand=G.cand.filter(x=>x!==c);
  E.say(`${c.name} joined the team!`);E.H.sfx('fanfare');return true;
};
E.fire = sid=>{const s=E.staff(sid);if(!s)return false;if(s.role==='drv'&&E.drivers().length<=1){E.H.toast('You need at least one driver');return false;}
  G.staff=G.staff.filter(x=>x!==s);E.say(`${s.name} left the team.`);return true;};
E.mechLvCost = s=>Math.round(12*Math.pow(s.lv,1.9));
E.levelMech = sid=>{const s=E.staff(sid);if(!s||s.role!=='mec'||s.lv>=10)return false;const c=E.mechLvCost(s);
  if(G.rp<c){E.H.toast('Not enough research data');return false;}G.rp-=c;s.lv++;
  const t=U.ri(3,6)+s.lv,a=U.ri(1,3),an=U.ri(1,4);s.tech+=t;s.appeal+=a;s.analysis+=an;s.salary=Math.round(s.salary*1.08/1000)*1000;
  E.say(`${s.name} reached Lv${s.lv}! Tech +${t}`);E.H.sfx('good');return true;};
E.trainCost = (s,t)=>t.cost<0?Math.round(t.cost*(1+E.fanRank()*0.3)/1000)*1000:Math.round(t.cost*(1+(s.pedal+s.shift+s.steer)/450)/1000)*1000;
E.trainAvail = id=>{const t=D.TRAIN[id];return t.un==='S'||!!G.unl.train[id];};
E.train = (sid,tid,spark)=>{
  const s=E.staff(sid),t=D.TRAIN[tid];if(!s||s.role!=='drv'||!E.trainAvail(tid))return null;
  const en=Math.round(t.en*(s.trait==='iron'?0.6:1));if(s.energy<en){E.H.toast(`${s.name} is too tired`);return null;}
  const tc=E.trainCost(s,t);if(tc>0&&G.money<tc){E.H.toast('Not enough money');return null;}
  if(spark&&!E.useSpark(spark))return null;
  G.money-=tc;s.energy-=en;const out={};
  const sm=spark?{b:1.5,s:2,g:3}[spark]:1;const gm=(1+E.facV('train')/100)*(s.trait==='bloomer'?1.4:1)*sm;
  for(const k in t.g){
    if(k==='car'||k==='bike'){s.aff[k]=+Math.min(1.45,s.aff[k]+t.g[k]*sm).toFixed(2);out[k]='+';continue;}
    if(k==='maxE'){s.maxE=Math.min(160,s.maxE+t.g[k]);out.maxE=t.g[k];continue;}
    const dim=120/(120+s[k]*0.35);const g=Math.max(1,Math.round(t.g[k]*gm*U.rand(0.8,1.3)*dim));s[k]+=g;out[k]=g;
  }
  if(tid==='oddjobs'){out.money=-tc;}
  return out;
};

// ---------- sponsors ----------
E.sponsorOffers = ()=>D.SPONSORS.filter(s=>G.fans>=s.fans&&!G.spons.find(x=>x.id===s.id)).sort((a,b)=>b.fans-a.fans).slice(0,5);
E.sponsorPay = sp=>Math.round(D.SPON[sp.id].mo*1000*(1+0.3*(sp.ad-1))*(1+E.facV('spon')/100));
E.signSponsor = id=>{
  if(G.spons.length>=E.ws().spon){E.H.toast('Sponsor slots full');return false;}
  const S=D.SPON[id];const done=!!G.sponDone[id];
  G.money+=done?Math.round(S.sign*500):S.sign*1000;
  G.spons.push({id,ad:1,adx:0,day:G.day,base:{st:JSON.parse(JSON.stringify(G.st)),fans:G.fans},done});
  E.say(`Signed with ${S.n}!`);E.H.sfx('fanfare');return true;
};
E.cancelSponsor = id=>{G.spons=G.spons.filter(s=>s.id!==id);E.say(`Contract with ${D.SPON[id].n} ended.`);};
E.goalKey = g=>g.disc?'disc:'+g.disc:g.surf?'terr:'+g.surf:g.cls?'cls:'+g.cls:g.tier?'tier:'+g.tier:null;
E.goalProgress = sp=>{
  const g=D.SPON[sp.id].goal,b=sp.base.st;
  switch(g.t){
    case 'enter':return[G.st.races-b.races,g.n];
    case 'races':return[G.st.races-b.races,g.n];
    case 'podium':return[G.st.podiums-b.podiums,g.n];
    case 'win':{const k=E.goalKey(g);if(!k)return[G.st.wins-b.wins,g.n];return[(G.st.wc['w:'+k]||0)-(b.wc['w:'+k]||0),g.n];}
    case 'series':{const cnt=G.st.titles.filter(t=>{const S=D.SER[t];return(!g.tier||S.tier===g.tier)&&(!g.disc||S.disc===g.disc);}).length;
      const bc=b.titles.filter(t=>{const S=D.SER[t];return(!g.tier||S.tier===g.tier)&&(!g.disc||S.disc===g.disc);}).length;return[cnt-bc,g.n];}
    case 'fans':return[G.fans,g.n];
    case 'money':return[G.money,g.n];
  }return[0,1];
};
E.goalText = g=>{
  const f=[g.disc?D.DISC[g.disc].n:'',g.surf?D.TERR_N[g.surf]:'',g.cls==='bike'?'bike':g.cls==='car'?'car':'',g.tier?D.TIER_N[g.tier]:''].filter(Boolean).join(' ');
  switch(g.t){case 'enter':return`Enter ${g.n} races`;case 'races':return`Run ${g.n} races`;case 'podium':return`Finish on the podium ${g.n}×`;
    case 'win':return`Win ${g.n>1?g.n+' ':'a '}${f?f+' ':''}race${g.n>1?'s':''}`;case 'series':return`Win ${g.n>1?g.n+' ':'a '}${f?f+' ':''}series title${g.n>1?'s':''}`;
    case 'fans':return`Reach ${U.num(g.n)} fans`;case 'money':return`Hold ${U.money(g.n)}`;}return'';
};
E.rewardText = rw=>{const a=[];
  (rw.train||[]).forEach(t=>a.push('Training: '+D.TRAIN[t].n));(rw.layout||[]).forEach(t=>a.push('Layout: '+D.LAYOUT[t].n));
  (rw.part||[]).forEach(t=>a.push('Part: '+D.PART[t].n));(rw.body||[]).forEach(t=>a.push('Vehicle: '+D.BODY[t].n));
  (rw.fac||[]).forEach(t=>a.push('Facility: '+D.FAC[t].n));if(rw.cash)a.push('Bonus '+U.money(rw.cash*1000));return a.join(', ');};
E.checkSponsors = ()=>{
  for(const sp of G.spons){if(sp.done)continue;const[c,n]=E.goalProgress(sp);if(c>=n){
    sp.done=true;G.sponDone[sp.id]=1;const S=D.SPON[sp.id],rw=S.rw;
    (rw.train||[]).forEach(t=>G.unl.train[t]=1);(rw.layout||[]).forEach(t=>G.unl.layout[t]=1);(rw.part||[]).forEach(t=>G.unl.part[t]=1);
    (rw.body||[]).forEach(t=>G.unl.body[t]=1);(rw.fac||[]).forEach(t=>G.unl.fac[t]=1);if(rw.cash)G.money+=rw.cash*1000;
    E.log(`${S.n} goal complete!`);E.H.popup({title:'Sponsor Goal Achieved!',html:`<b>${U.esc(S.n)}</b> is thrilled!<br><br>Unlocked: ${U.esc(E.rewardText(rw))}`});E.H.sfx('fanfare');
  }}
};

// ---------- facilities ----------
E.facAvail = id=>D.FAC[id].un==='S'||!!G.unl.fac[id];
E.buildFac = (id)=>{
  const W=E.ws();const used=G.fac.filter(Boolean).length;if(used>=W.fac){E.H.toast('No free facility slots');return false;}
  if(G.fac.find(f=>f&&f.id===id))return false;const c=D.FAC[id].cost[0]*1000;if(G.money<c){E.H.toast('Not enough money');return false;}
  G.money-=c;G.fac.push({id,lv:1});E.say(`Built ${D.FAC[id].n}!`);E.H.sfx('fanfare');return true;};
E.upgradeFac = id=>{const f=G.fac.find(f=>f&&f.id===id);if(!f||f.lv>=3)return false;const c=D.FAC[id].cost[f.lv]*1000;
  if(G.money<c){E.H.toast('Not enough money');return false;}G.money-=c;f.lv++;E.say(`${D.FAC[id].n} upgraded to Lv${f.lv}`);E.H.sfx('good');return true;};
E.demolishFac = id=>{G.fac=G.fac.filter(f=>f&&f.id!==id);E.say(`Removed ${D.FAC[id].n}`);};

// ---------- workshop ----------
E.wsNeed = ()=>G.ws<4?{titles:1,tier:G.ws,cost:D.WORKSHOPS[G.ws+1].cost}:null;
E.canUpgradeWS = ()=>{const n=E.wsNeed();if(!n)return false;return E.titlesIn(n.tier)>=n.titles;};
E.upgradeWS = ()=>{if(!E.canUpgradeWS())return false;const n=E.wsNeed();if(G.money<n.cost){E.H.toast('Not enough money');return false;}
  G.money-=n.cost;G.ws++;E.say(`Moved into the ${E.ws().n}!`);E.H.sfx('fanfare');
  E.H.popup({title:`Welcome to the ${E.ws().n}!`,html:`More room for staff, vehicles, facilities and sponsors.<br><br>New ${D.TIER_N[G.ws]} races and research are now available!`});return true;};
E.legendOpen = ()=>G.ws>=4&&E.titlesIn(4)>=2;

// ---------- races ----------
E.best = id=>(G.races[id]&&G.races[id].best)||99;
E.raceState = id=>{
  const r=D.RACE[id];if(r.excl)return{ok:false,why:'Series only',series:true};
  if(r.tier===5){if(!E.legendOpen())return{ok:false,why:'Win 2 World series'};}
  else if(G.ws<r.tier)return{ok:false,why:`Needs ${D.WORKSHOPS[r.tier].n}`};
  if(r.letter==='a'){if(r.disc==='OP'&&r.tier===1&&G.st.wins<2)return{ok:false,why:'Win 2 races first'};return{ok:true};}
  const prev=r.id.slice(0,-1)+(r.letter==='b'?'a':'b');
  if(E.best(prev)>3)return{ok:false,why:`Top 3 at ${D.RACE[prev].n}`};return{ok:true};
};
E.seriesState = id=>{
  const S=D.SER[id];const st=G.series[id]||{};
  if(st.act)return{ok:false,active:true,why:'In progress'};
  if(S.tier===5&&!E.legendOpen())return{ok:false,why:'Win 2 World series'};
  if(S.tier<5&&G.ws<S.tier)return{ok:false,why:`Needs ${D.WORKSHOPS[S.tier].n}`};
  const normals=D.RACES.filter(r=>r.tier===S.tier&&r.disc===S.disc&&!r.excl);
  const need=S.disc==='OP'&&S.tier<5?1:2;const w=normals.filter(r=>E.best(r.id)===1).length;
  if(w<need)return{ok:false,why:`Win ${need} ${D.DISC[S.disc].n} ${D.TIER_N[S.tier]} race${need>1?'s':''} (${w}/${need})`};
  if(st.lastStart!=null&&G.day-st.lastStart<D.DAYS_YEAR)return{ok:false,why:`Next season in ${D.DAYS_YEAR-(G.day-st.lastStart)}d`};
  if(Object.values(G.series).filter(x=>x.act).length>=E.ws().teams)return{ok:false,why:'Too many active series'};
  return{ok:true};
};
E.availRaceIds = ()=>D.RACES.filter(r=>E.raceState(r.id).ok).map(r=>r.id).concat(D.SERIES.filter(s=>E.seriesState(s.id).ok).map(s=>s.id));
E.clsOk = (race,v)=>race.cls==='any'||D.BODY[v.body].cls===race.cls;
E.eligibleVehicles = race=>G.vehicles.filter(v=>v.status==='ready'&&E.clsOk(race,v)&&E.engReady(v));
E.raceEnergy = s=>s.trait==='iron'?20:30;
E.eligibleDrivers = ()=>E.drivers().filter(s=>s.energy>=E.raceEnergy(s));

// effective race profile of driver+vehicle
E.profile = (v,s)=>{
  const st=E.vs(v),cls=D.BODY[v.body].cls,aff=s.aff[cls];
  const dm=x=>1+x/(x+250);let S=st.spd*dm(s.pedal)*aff,A=st.acc*dm(s.shift)*aff,H=st.hnd*dm(s.steer)*aff;
  if(s.trait==='drift'&&cls==='car')H*=1.1;if(s.trait==='wheelie'&&cls==='bike')A*=1.1;
  const t={on:st.on,off:st.off,wet:st.wet,ice:st.ice};
  if(s.trait==='dirt')t.off+=15;if(s.trait==='rain')t.wet+=20;if(s.trait==='ice')t.ice+=20;if(s.trait==='tar')t.on+=10;
  let pm=1;if(s.trait==='hothead')pm*=1.04;if(s.energy<40)pm*=0.95;
  let mis=st.fx.mis;if(s.trait==='steady')mis*=0.6;if(s.trait==='hothead')mis*=1.6;
  return {S,A,H,t,pm,mis,wear:st.fx.wear*(s.trait==='iron'?0.9:1)*(cls==='bike'?0.85:1),dur:st.dur,cls};
};
// expected pace ratio vs race rating
E.oddsRatio = (race,v,s)=>{
  const p=E.profile(v,s);const tr=Race.track(race,false);const rt=Race.rivalTerr(race);let tot=0,rv=0;
  const cond=T.forecast(race);const rsx=T.raceSecs(v,race,tr,cond,T.mode()==='easy');
  tr.secs.forEach((sc,i)=>{const w=D.SEC[sc.type].w;const tk=D.SURF[sc.surf].k;const k=rsx.secs[i];tot+=((w[0]*p.S*k.s+w[1]*p.A*k.a)*k.ef+w[2]*p.H*k.h)*(U.clamp(p.t[tk]*k.t,5,220)/100)*p.pm*sc.len;rv+=race.R*Race.rivalMul()*(rt[tk]+1)/100*sc.len;});
  return tot/rv;
};
E.oddsLabel = r=>r<0.8?['Hopeless','#f55']:r<0.95?['Tough','#f95']:r<1.07?['Even','#fd5']:r<1.2?['Favored','#9e5']:['Dominant','#5ef'];

// ---------- series ----------
E.enterSeries = id=>{
  const S=D.SER[id];const st=E.seriesState(id);if(!st.ok){E.H.toast(st.why);return false;}
  if(G.money<S.fee){E.H.toast('Not enough money for entry fee');return false;}
  G.money-=S.fee;const rv=U.shuffle(D.RIVALS).slice(0,S.rivals);
  const rivals=rv.map((r,i)=>({team:r[0],col:r[1],drv:U.pick(D.FIRST)+' '+U.pick(D.LAST),f:+(1.13-0.3*i/(S.rivals-1)+U.rand(-0.03,0.03)).toFixed(3)}));
  G.series[id]=G.series[id]||{titles:0,best:99};G.series[id].lastStart=G.day;
  G.series[id].act={round:0,next:G.day+7,pts:{you:0},rivals,res:[],pending:false};
  rivals.forEach(r=>G.series[id].act.pts[r.team]=0);
  E.say(`Entered the ${S.n}! Round 1 in 7 days.`);E.H.sfx('fanfare');return true;
};
E.standings = id=>{const a=G.series[id].act;return Object.entries(a.pts).sort((x,y)=>y[1]-x[1]);};
E.seriesRoundDone = (id,rs)=>{
  const a=G.series[id].act,S=D.SER[id];
  // points
  rs.order.forEach((e,i)=>{if(e.dnf)return;const p=D.POINTS[i]||0;const key=e.isPlayer?'you':e.team;a.pts[key]=(a.pts[key]||0)+p;});
  const me=rs.order.findIndex(e=>e.isPlayer);a.res.push(rs.player.dnf?'DNF':me+1);
  a.round++;a.pending=false;
  if(a.round>=S.rounds.length)E.endSeries(id);else{a.next=G.day+21;E.log(`${S.n}: round ${a.round+1} in 3 weeks`);}
};
E.seriesRoundSkip = id=>{const a=G.series[id].act;a.res.push('—');a.round++;a.pending=false;
  // rivals still score
  const order=a.rivals.slice().sort((x,y)=>y.f*U.rand(0.9,1.1)-x.f*U.rand(0.9,1.1));order.forEach((r,i)=>a.pts[r.team]+=D.POINTS[i]||0);
  if(a.round>=D.SER[id].rounds.length)E.endSeries(id);else a.next=G.day+21;};
E.endSeries = id=>{
  const S=D.SER[id],st=G.series[id],a=st.act;const tb=E.standings(id);const pos=tb.findIndex(x=>x[0]==='you')+1;
  st.lastEnd=G.day;st.best=Math.min(st.best||99,pos);delete st.act;
  let html=`<div class="stand">`+tb.slice(0,6).map((x,i)=>`<div class="${x[0]==='you'?'me':''}">${i+1}. ${U.esc(x[0]==='you'?G.team.name:x[0])} <b>${x[1]}</b></div>`).join('')+`</div>`;
  if(pos===1){
    const first=!G.st.titles.includes(id);G.st.titles.push(id);st.titles++;G.year.titles++;
    const prize=first?S.prize:Math.round(S.prize*0.5);G.money+=prize;G.st.earn+=prize;G.year.earn+=prize;
    const fans=Math.round(S.prize/1500*(1+E.facV('fans')/100));G.fans+=fans;E.giveSpark('g','Series champion!');
    html=`<div class="big">🏆 CHAMPIONS! 🏆</div>${html}<br>Prize ${U.money(prize)} · Fans +${U.num(fans)}`;
    if(E.canUpgradeWS())html+=`<br><br><b class="hl">A bigger workshop is available! (Team menu)</b>`;
    E.H.sfx('fanfare');
  }else{
    const prize=pos<=3?Math.round(S.prize*(pos===2?0.4:0.2)):0;G.money+=prize;G.st.earn+=prize;G.fans+=Math.round(S.prize/6000);
    html=`<div class="big">${U.ord(pos)} in the championship</div>${html}`+(prize?`<br>Prize ${U.money(prize)}`:'');
  }
  E.log(`${S.n} finished: ${U.ord(pos)}`);E.H.popup({title:S.n+' — Final',html});E.checkSponsors();
};

// ---------- race results ----------
E.finishRace = (rs)=>{
  const def=rs.def,P=rs.player,v=E.veh(P.vid),s=E.staff(P.sid);
  const pos=rs.forcePos||rs.order.indexOf(P)+1;const dnf=P.dnf;const mul=(rs.fmt&&rs.fmt.mul)||{prize:1,rp:1,fans:1,wear:1};const ff=dnf?0.1:[1,.75,.6,.45,.38,.32,.28,.24,.2,.18,.16,.15][pos-1]||0.12;
  const out={pos,dnf,prize:0,rp:0,fans:0,unl:[],spark:null,destroyed:P.destroyed};
  const before=new Set(E.availRaceIds());const rk0=E.fanRank();
  // money
  const rep=!rs.series&&G.yearWins[def.id]?0.4:1;if(!dnf&&pos<=12){out.prize=Math.round(def.prize*D.PRIZE_SPLIT[pos-1]*rep*mul.prize/100)*100;}out.rep=rep<1;
  G.money+=out.prize;G.st.earn+=out.prize;G.year.earn+=out.prize;
  // RP
  const mAn=E.mechs().length?U.sum(E.mechs(),m=>m.analysis)/E.mechs().length:0;
  const vst=v?E.vs(v):{fx:{rp:0,fan:0},adv:0};
  out.rp=Math.round(def.rp*ff*(1+(s.analysis+mAn)/250)*(1+E.facV('rp')/100)*(1+vst.fx.rp)*(rs.series?1.3:1)*(rep<1?0.6:1)*mul.rp*(T.has('telem')?1.1:1));G.rp+=out.rp;
  // fans
  out.fans=Math.round(def.R*0.6*ff*(rep<1?0.5:1)*mul.fans*(1+s.appeal/250)*(1+E.facV('fans')/100)*(s.trait==='show'?1.3:1)*(1+vst.fx.fan)*(rs.series?1.4:1));G.fans+=out.fans;
  // stats
  G.st.races++;if(!dnf&&pos===1){G.st.wins++;G.year.wins++;G.yearWins[def.id]=1;}if(!dnf&&pos<=3){G.st.podiums++;G.year.podiums++;}if(dnf)G.st.dnf++;
  if(!dnf&&pos===1){E.wkey('w:disc:'+def.disc);E.wkey('w:cls:'+(v?D.BODY[v.body].cls:def.cls));E.wkey('w:tier:'+def.tier);
    const tk={};for(const k in def.surf){const t=D.SURF[k].k;tk[t]=(tk[t]||0)+def.surf[k];}if(rs.rain&&tk.on){tk.wet=(tk.wet||0)+tk.on;}
    for(const k in tk)if(tk[k]>=40)E.wkey('w:terr:'+k);}
  // best & sparks
  const rr=G.races[def.id]=G.races[def.id]||{best:99,n:0,w:0};rr.n++;if(!dnf&&pos===1)rr.w++;
  if(!dnf&&pos<rr.best){if(pos<=3){const t=pos===1?'g':pos===2?'s':'b';E.giveSpark(t,'First '+(pos===1?'win':'podium')+' here!');out.spark=t;}rr.best=pos;}
  if(!dnf&&s.trait==='lucky'&&U.chance(0.15)){E.giveSpark('b','Lucky!');}
  // vehicle
  if(v){
    v.races++;if(!dnf&&pos===1)v.wins++;
    if(P.destroyed){E.removeVehicle(v.id);E.log(`${v.name} was destroyed!`);}
    else{
      v.hp=U.clamp(P.hp,0,1);v.xp+=Math.round(def.tier*12*(ff+0.3));
      while(v.lv<10&&v.xp>=E.vehXpNeed(v)){v.xp-=E.vehXpNeed(v);v.lv++;out.vlv=v.lv;}
      for(const pid of v.parts){const pl=G.partLv[pid]=G.partLv[pid]||{lv:1,xp:0};if(pl.lv<5){pl.xp+=def.tier*8+4;while(pl.lv<5&&pl.xp>=40*pl.lv){pl.xp-=40*pl.lv;pl.lv++;}}}
      E.engAfter(v,rs,P,mul);
      if(v.hp<0.999){const days=Math.max(1,Math.ceil((1-v.hp)*14));v.status='repair';G.jobs.push({id:E.nid(),type:'rep',vid:v.id,left:days,total:days,req:D.RANK_REQ[D.BODY[v.body].rank],nob:true});}
      else v.status='ready';
    }
  }
  // driver
  s.energy=Math.max(0,s.energy-E.raceEnergy(s));
  const gains=[];if(U.chance(0.6)){const k=U.pick(['pedal','shift','steer']);s[k]+=1;gains.push(k);}
  // sponsors ad
  for(const sp of G.spons){if(sp.ad>=5)continue;sp.adx+=(s.appeal+vst.adv)/8*(ff+0.3);while(sp.ad<5&&sp.adx>=60*sp.ad){sp.adx-=60*sp.ad;sp.ad++;E.log(`${D.SPON[sp.id].n} ad effect Lv${sp.ad}!`);}}
  // streaks & achievements
  if(!dnf&&pos===1){G.st.streak=(G.st.streak||0)+1;if(G.st.streak>=3)E.ach('hat');}else G.st.streak=0;
  if(!dnf&&pos===1){const c=rs.cond||{alt:0,temp:20};if(v&&v.eng&&v.eng.fuel==='carb'&&Math.max(c.alt,c.alt2||0)>=2500)E.ach('thinair');if(c.temp<=-10)E.ach('frozen');
    if(def.disc==='HC'||def.style==='hill'){E.ach('hill1');if((c.alt2||0)>=4000)E.ach('clouds');}if(rs.fmt&&rs.fmt.id==='endur')E.ach('endur');
    if(rs.gridSlot!=null&&rs.gridSlot>=Math.floor(rs.ents.length/2))E.ach('comeback');if(rs.heatWin)E.ach('heatmain');if(rs.drag)E.ach('drag1');}
  if(!dnf&&rs.fmt&&rs.fmt.id==='endur')E.ach('endur');
  if(P.holed)E.ach('holed');if(P.seized)E.ach('seize');
  if(rs.fuelCost){G.money-=rs.fuelCost;}
  E.checkSponsors();E.checkAch();
  const after=E.availRaceIds();out.unl=after.filter(x=>!before.has(x));
  E.log(`${def.n}: ${dnf?'DNF':U.ord(pos)} (+${U.money(out.prize)})`);
  const rk1=E.fanRank();if(rk1>rk0){E.H.popup({title:'📣 Team Rank Up!',html:`Your team is now <b class="hl">${D.FAN_RANKS[rk1][1]}</b>!<br><br>Bigger sponsors are calling, and better staff want to join.`});E.refreshCandidates();}
  return out;
};
E.engAfter = (v,rs,P,mul)=>{
  const e=v.eng;if(!e)return;
  if(e.fuel!=='none'){
    const wear=0.014*mul.wear*(T.has('oilcool')?0.7:1)*(rs.tactic==='push'?1.3:rs.tactic==='safe'?0.8:1);
    e.cond=U.clamp((P.cond!=null?P.cond:e.cond)-wear,0,1);
    const n=e.sync.length,bi=T.syncBase(n);e.sync=e.sync.map((x,i)=>i===bi?0:+U.clamp(x+U.rand(-0.45,0.45)*(1+def_t(rs)*0.1),-6,6).toFixed(1));
    if(T.has('datalog')&&rs.cond)e.log=T.makeLog(v,rs.cond,'Race: '+rs.def.n);
    if(e.cond<=0)E.H.popup({title:'💥 Engine Failure',html:`${U.esc(v.name)}'s engine is finished. Open <b>Garage → Engine</b> to rebuild it before racing again.`});
  }
};
const def_t = rs=>rs.def.tier||1;
E.engReady = v=>!v.eng||v.eng.fuel==='none'||v.eng.cond>0.02;
E.startRebuild = vid=>{const v=E.veh(vid);if(!v||v.status!=='ready')return false;if(!E.canStartJob())return false;const c=T.rebuildCost(v);if(G.money<c){E.H.toast('Not enough money');return false;}
  G.money-=c;v.status='upgrade';const days=Math.ceil(3+(1-v.eng.cond)*10);G.jobs.push({id:E.nid(),type:'reb',vid,left:days,total:days,req:D.RANK_REQ[D.BODY[v.body].rank]});E.say(`Rebuilding ${v.name}'s engine`);return true;};
E.startSwap = (vid,sys)=>{const v=E.veh(vid);if(!v||v.status!=='ready')return false;if(!E.canStartJob())return false;const b=D.BODY[v.body];
  const c=sys.type==='efi'?T.efiCost(b):T.carbSwapCost(b,sys.carb);if(G.money<c){E.H.toast('Not enough money');return false;}
  G.money-=c;v.status='upgrade';G.jobs.push({id:E.nid(),type:'swap',vid,sys,left:4,total:4,req:D.RANK_REQ[b.rank]});E.say(`Fitting ${sys.type==='efi'?'EFI':D.CARBS[sys.carb].n} to ${v.name}`);return true;};
E.researchTech = id=>{const t=D.TECHM[id];if(!t||T.has(id))return false;if(!E.techAvail(id).ok)return false;if(G.rp<t.rp){E.H.toast('Not enough research data');return false;}
  G.rp-=t.rp;G.tech[id]=1;E.say(`Tech unlocked: ${t.n}!`);E.H.sfx('fanfare');E.checkAch();return true;};
E.techAvail = id=>{const t=D.TECHM[id];if(T.has(id))return{ok:true,done:true};if(G.ws<t.ws)return{ok:false,why:`Needs ${D.WORKSHOPS[t.ws].n}`};
  const miss=t.req.filter(r=>!T.has(r));if(miss.length)return{ok:false,why:'Needs '+miss.map(r=>D.TECHM[r].n).join(', ')};return{ok:true};};
E.ach = id=>{if(!G.ach)G.ach={};if(G.ach[id])return false;const a=D.ACHM[id];if(!a)return false;G.ach[id]=G.day+1;
  const rw=a.rw||{};if(rw.cash)G.money+=rw.cash*1000;if(rw.rp)G.rp+=rw.rp;if(rw.spark)G.sparks[rw.spark]++;
  const r=[rw.cash?U.money(rw.cash*1000):'',rw.rp?rw.rp+' RP':'',rw.spark?({b:'Bronze',s:'Silver',g:'Gold'}[rw.spark])+' Spark':''].filter(Boolean).join(' + ');
  E.log(`Achievement: ${a.n}`);E.H.popup({title:`${a.ic} Achievement!`,html:`<div class="big">${U.esc(a.n)}</div><div style="text-align:center">${U.esc(a.d)}</div>${r?`<div style="text-align:center" class="hl">Reward: ${r}</div>`:''}`});E.H.sfx('fanfare');return true;};
E.checkAch = ()=>{for(const a of D.ACH)if(a.chk&&!(G.ach&&G.ach[a.id])){try{if(a.chk(G))E.ach(a.id);}catch(e){}}};
E.vehXpNeed = v=>Math.round(40*Math.pow(v.lv,1.3));

// ---------- test day ----------
E.testCost = laps=>laps*3000*G.ws;
E.finishTest = rs=>{
  const v=E.veh(rs.player.vid),s=E.staff(rs.player.sid);const laps=rs.tr.laps;const out={gains:[]};
  G.money-=E.testCost(laps);s.energy=Math.max(0,s.energy-(8+2*laps));G.st.tests=(G.st.tests||0)+1;
  const n=Math.max(1,Math.floor(laps/3));for(let i=0;i<n;i++){const k=U.pick(['pedal','shift','steer']);s[k]+=1;out.gains.push(k);}
  const cls=D.BODY[v.body].cls;s.aff[cls]=+Math.min(1.45,s.aff[cls]+0.004*laps).toFixed(3);
  v.xp+=laps*2;while(v.lv<10&&v.xp>=E.vehXpNeed(v)){v.xp-=E.vehXpNeed(v);v.lv++;}
  if(v.eng&&v.eng.fuel!=='none'){v.eng.cond=U.clamp((rs.player.cond!=null?rs.player.cond:v.eng.cond)-0.002*laps,0,1);v.eng.log=T.makeLog(v,rs.cond,'Test: '+rs.def.n);}
  v.hp=U.clamp(rs.player.hp,0,1);if(v.hp<0.999){const days=Math.max(1,Math.ceil((1-v.hp)*14));v.status='repair';G.jobs.push({id:E.nid(),type:'rep',vid:v.id,left:days,total:days,req:D.RANK_REQ[D.BODY[v.body].rank],nob:true});}
  E.checkAch();E.log(`Test day: ${laps} laps with ${v.name}`);return out;
};

// ---------- time ----------
E.jobRate = job=>{
  const n=G.jobs.filter(j=>!j.nob).length;const share=job.nob?1:1+0.35*Math.max(0,n-1);
  const lazy=G.lazyUntil&&G.lazyUntil>G.day?0.6:1;
  return U.clamp(0.5+0.7*E.teamTech()/job.req,0.5,2.6)*(1+E.facV('speed')/100)/share*lazy;
};
E.tick = ()=>{
  G.day++;
  // jobs
  for(const j of G.jobs.slice()){
    const v=E.veh(j.vid);if(!v){G.jobs=G.jobs.filter(x=>x!==j);continue;}
    j.left-=E.jobRate(j);
    if(j.type==='build'){const prog=1-j.left/j.total;const ph=[0.3,0.6,0.9];while(j.ph<3&&prog>=ph[j.ph]){E.buildPhase(v,j);j.ph++;}}
    if(j.type==='rep')v.hp=Math.min(1,v.hp+(1/14)*E.jobRate(j));
    if(j.left<=0){G.jobs=G.jobs.filter(x=>x!==j);
      if(j.type==='build')E.finishBuild(v);else if(j.type==='up')E.finishUpgrade(v,j);else if(j.type==='rep'){v.hp=1;v.status='ready';E.log(`${v.name} repaired`);}
      else if(j.type==='reb'){v.eng.cond=1;v.status='ready';E.say(`${v.name}: fresh engine!`);E.H.float('Rebuilt!',v.id,'#8ef58e');}
      else if(j.type==='swap'){const keep=v.eng.fuelT;T.initEng(v,j.sys);v.eng.fuelT=keep;v.status='ready';E.say(`${v.name}: ${j.sys.type==='efi'?'EFI installed — base map loaded, go tune it!':D.CARBS[j.sys.carb].n+' fitted'}`);if(j.sys.type==='efi')E.ach('efi1');}}
  }
  // energy
  for(const s of E.drivers())s.energy=Math.min(s.maxE,s.energy+1.6+E.facV('regen'));
  // series rounds due
  for(const id in G.series){const a=G.series[id].act;if(a&&!a.pending&&G.day>=a.next){a.pending=true;E.H.roundDue(id);}}
  // random events
  if(U.chance(0.018))E.randomEvent();
  if(G.day%D.DAYS_MONTH===0)E.monthly();
  if(G.day%D.DAYS_YEAR===0)E.yearly();
};
E.monthly = ()=>{
  const sal=U.sum(G.staff,s=>s.salary);const sp=U.sum(G.spons,s=>E.sponsorPay(s));const merch=Math.round(G.fans*E.facV('merch'));
  G.money+=sp+merch-sal;G.lastMonth={sal,sp,merch};
  E.log(`Month end: sponsors +${U.money(sp)}${merch?`, merch +${U.money(merch)}`:''}, salaries -${U.money(sal)}`);
  if(G.money<0)E.H.toast('⚠ In the red! Race, sign sponsors or do Odd Jobs.');
  E.refreshCandidates();E.checkSponsors();E.checkAch();G.wxRain=U.chance(0.2);
};
E.yearly = ()=>{
  const y=E.year()-1;const rank=E.fanRank();const bonus=rank*rank*40000;G.money+=bonus;
  const yr=G.year;G.year={wins:0,podiums:0,earn:0,titles:0};G.yearWins={};
  E.H.yearEnd({y,yr,bonus,rank});
  if(y>=D.YEARS&&!G.ended){G.ended=true;E.H.gameEnd(E.score());}
};
E.score = ()=>{
  const t=G.st.titles.reduce((s,id)=>s+[0,100,300,800,2000,5000][D.SER[id].tier],0);
  return Math.round(t+G.st.wins*20+G.st.podiums*5+G.fans/50+Math.max(0,G.money)/50000+G.ws*200);
};

// ---------- random events ----------
E.EVENTS = [
  {w:3,f(){const m=U.ri(5,20)*1000*(1+E.fanRank());G.money+=m;return `A fan sent a care package! +${U.money(m)}`;}},
  {w:3,f(){const s=U.pick(E.mechs());if(!s)return null;const r=U.ri(3,8)+G.ws*3;G.rp+=r;E.H.float('Idea!',null,'#ffe066');return `${s.name} had a brainstorm! +${r} RP`;}},
  {w:2,f(){const f=Math.round(30+G.fans*0.04);G.fans+=f;return `A racing magazine featured the team! +${f} fans`;}},
  {w:2,f(){const s=U.pick(E.mechs());if(!s)return null;G.lazyUntil=G.day+5;return `${s.name} is slacking off... work slows for a few days.`;}},
  {w:1,f(){E.giveSpark('b','');return `Found an old trophy in the parts bin. It sparkles!`;}},
  {w:2,f(){const s=U.pick(E.drivers());s.appeal+=2;return `${s.name} signed autographs for local kids. Appeal +2`;}},
  {w:2,f(){const s=U.pick(E.staff?G.staff:[]);if(!s)return null;s.tech+=2;return `${s.name} learned a new trick from a video. Tech +2`;}},
  {w:1,f(){if(E.fanRank()<2)return null;const m=50000*E.fanRank();G.money+=m;return `An investor was impressed! +${U.money(m)}`;}},
  {w:2,f(){const d=U.pick(E.drivers());d.energy=Math.min(d.maxE,d.energy+30);return `${d.name} had a great night's sleep. Energy +30`;}},
  {w:1,f(){G.wxRain=true;return `Weather service: rain likely at the next tarmac race.`;}},
  {w:1,f(){const m=U.ri(10,30)*1000;G.money+=m;return `The team bake sale was a hit! +${U.money(m)}`;}},
];
E.randomEvent = ()=>{const tot=U.sum(E.EVENTS,e=>e.w);let r=Math.random()*tot;for(const e of E.EVENTS){r-=e.w;if(r<=0){const t=e.f();if(t)E.say(t);return;}}};

// ---------- save ----------
E.serialize = ()=>JSON.stringify(G);
E.load = (str)=>{const o=typeof str==='string'?JSON.parse(str):str;if(!o||o.v!==1||!o.team)throw new Error('bad save');G=o;
  G.settings=Object.assign({speed:1,autoRetire:true,sound:true,mode:'standard'},G.settings||{});G.st.wc=G.st.wc||{};G.year=G.year||{wins:0,podiums:0,earn:0,titles:0};
  G.tech=G.tech||{carbbasic:1};G.ach=G.ach||{};G.st.tests=G.st.tests||0;G.st.streak=G.st.streak||0;G.st.cells=G.st.cells||0;
  for(const v of G.vehicles){if(!v.eng)T.initEng(v,null);if(!v.setup)v.setup=T.defaultSetup(v);}return G;};

// ===================== RACE SIM =====================
const Race = {cache:{}};
Race.LEN = {str:[2,4],crv:[2,3],hp:[1,1],chi:[1,2],jmp:[1,1],rgh:[2,3],hill:[2,3],lau:[1,1]};
Race.TAC = {safe:{pace:0.95,mis:0.6,dmg:0.7,n:'Safe'},normal:{pace:1,mis:1,dmg:1,n:'Normal'},push:{pace:1.055,mis:1.5,dmg:1.35,n:'Push'}};
Race.KINDS = {
  CR:['hatch','sedan','roadster','coupe','gt','formula','proto','kart'],
  CO:['pickup','rally','buggy','sprint','truck','rally'],
  BR:['commuter','scooter','naked','sport','cafe','super','gp'],
  BO:['trail','mx','enduro','flat','raid','smoto','mx'],
};
Race.KINDS.DR=['hatch','sport','coupe','naked','gt','super','proto','gp'];
Race.KINDS.HC=['hatch','naked','rally','sport','coupe','smoto','gt','super','proto','gp'];
Race.rivalMul = ()=>T.mode()==='easy'?0.94:1;
Race.track = (def,rain)=>{
  const key=def.id+(rain?'r':'')+(def._laps||'');if(Race.cache[key])return Race.cache[key];
  const rng=U.seeded(U.hash(def.id)),st=D.STYLES[def.style];const secs=[];
  const pickW=p=>{let tot=0;for(const k in p)tot+=p[k];let r=rng()*tot;for(const k in p){r-=p[k];if(r<=0)return k;}return Object.keys(p)[0];};
  for(let i=0;i<st.n;i++){
    let type=st.pat?st.pat[i%st.pat.length]:pickW(st.p);
    if(!st.pat&&i===0)type=st.p.str?'str':type;
    if(!st.pat&&i>0&&type===secs[i-1].type&&(type==='jmp'||type==='hp'||type==='chi'))type=st.p.crv?'crv':'str';
    const[a,b]=Race.LEN[type]||[1,2];secs.push({type,len:def.style==='drag'?(type==='lau'?1:2):a+Math.floor(rng()*(b-a+1))});
  }
  let at=0;secs.forEach(s=>{s.at=at;at+=s.len;});const lapLen=at;
  const ents=Object.entries(def.surf);const order=ents.map(e=>[e,rng()]).sort((a,b)=>a[1]-b[1]).map(x=>x[0]);
  let cum=0;const blocks=order.map(([k,w])=>{const s=cum;cum+=w;return[k,s,cum];});
  secs.forEach(s=>{const mid=(s.at+s.len/2)/lapLen*cum;let k=blocks[blocks.length-1][0];for(const b of blocks)if(mid>=b[1]&&mid<b[2]){k=b[0];break;}s.surf=(rain&&k==='tar')?'wet':k;});
  const laps=def._laps||def.laps;
  const tr={secs,lapLen,laps,total:lapLen*laps,p2p:!!st.p2p,oval:def.style==='oval',drag:def.style==='drag',hill:def.style==='hill'};
  Race.cache[key]=tr;return tr;
};
Race.mainSurf = (tr)=>{const m={};tr.secs.forEach(s=>m[s.surf]=(m[s.surf]||0)+s.len);return Object.entries(m).sort((a,b)=>b[1]-a[1])[0][0];};
Race.rivalTerr = def=>{const b=96+7*def.tier;const t={on:b,off:b,wet:b-6,ice:b-10};
  if(def.disc==='CR'||def.disc==='BR'||def.disc==='DR'){t.on+=28;t.wet+=10;}else if(def.disc==='CO'){t.off+=26;t.ice+=22;t.wet+=8;}else if(def.disc==='BO'){t.off+=28;t.ice+=10;}
  else if(def.disc==='HC'){t.on+=22;t.off+=12;t.wet+=8;t.ice+=10;}else{t.on+=12;t.off+=12;t.wet+=8;t.ice+=8;}
  return t;};
Race.mkRivals = (def,n)=>U.shuffle(D.RIVALS).slice(0,n).map((r,i)=>({team:r[0],col:r[1],drv:U.pick(D.FIRST)+' '+U.pick(D.LAST),f:1.12-0.28*i/Math.max(1,n-1)+U.rand(-0.03,0.03)}));

Race.create = (def,pl,opts={})=>{
  let rain=false;const fmt=opts.fmt||{id:'sprint',kind:'mass',laps:def.laps,mul:{prize:1,rp:1,fans:1,wear:1}};
  if(def.surf.tar&&!opts.test){if(G.wxRain){rain=true;G.wxRain=false;}else if(U.chance(0.08))rain=true;}
  const d2=Object.assign({},def,{_laps:fmt.laps!==def.laps?fmt.laps:null});const tr=Race.track(d2,rain);

  if(gauge){const w=Math.min(26,140/n);for(let i=0;i<n;i++){const x=14+i*(140/n)+(140/n-w)/2;BP(c,x,6,w,52,'#0d1020');BP(c,x,6,w,1,'#7d8590');
      for(let m=0;m<=10;m++)BP(c,x,8+m*5,3,1,'#4b5ea0');
      const off=v.eng.sync[i];const h=26+off*4+Math.sin(t*(18+i*1.3))*1.3;BP(c,x+w/2-2,58-h,4,h,'#c0392b');BP(c,x+w/2-2,58-h,4,2,'#ff8080');
      Bench.txt(c,i===bi?'BASE':`#${i+1}`,x+w/2,60,i===bi?'#ffd84a':'#cfe0ff','center');}
    BP(c,10,32,144,1,'#8ef58e');}
  else{const rpm=1200+Math.sin(t*(4+imb*3))*imb*90+Math.sin(t*23)*imb*40;Bench.txt(c,'No sync gauges — listening by ear…',80,12,'#cfe0ff','center',6);
    Bench.txt(c,`Idle ${Math.round(rpm)} rpm`,80,28,imb<0.6?'#8ef58e':imb<1.5?'#ffd84a':'#ff7070','center',8);
    Bench.txt(c,imb<0.6?'Smooth & even':imb<1.5?'A little lumpy':'Lumpy, hunting idle',80,44,'#cfe0ff','center',6);}
};
// ---------- dyno ----------
Bench.drawDyno = (c,v,dt)=>{
  const t=Bench.s.t;const d=Bench.s.dyno;const b=D.BODY[v.body];
  BP(c,0,0,160,90,'#1b2036');BP(c,0,62,160,28,'#2a2f45');for(let x=0;x<160;x+=16)BP(c,x,62,1,28,'#232838');
  // roller
  const spin=d&&d.running?t*30:0;BP(c,36,64,40,8,'#555');for(let k=0;k<4;k++)BP(c,36+((k*10+spin)%40),64,2,8,'#888');
  const w=GX.vehW(b.kind);GX.drawVeh(c,b.kind,56-w/2,64,G.team.color,'#ffd84a',d&&d.running?Math.floor(t*20)%2:0);
  BP(c,4,30,8,32,'#3d4766');BP(c,2,28,12,3,'#4f5b80');// fan
  if(d&&d.running){for(let k=0;k<5;k++)BP(c,14+((t*80+k*13)%40),36+k*5,6,1,'#7fd3ff');if(U.chance(0.6))Bench.s.drops.push({x:56-w/2-2,y:60,vx:-20,vy:-6,t:0,c:'#666'});}
  // rpm gauge
  const rpmMax=D.RPM_B[b.cls][7];const rpm=d?d.rpm:0;const ang=Math.PI*0.8+Math.PI*1.4*(rpm/rpmMax);
  BP(c,92,4,64,56,'#0d1020');c.strokeStyle='#4b5ea0';c.lineWidth=1;c.beginPath();c.arc(112,30,16,Math.PI*0.8,Math.PI*2.2);c.stroke();
  c.strokeStyle='#ff6060';c.beginPath();c.moveTo(112,30);c.lineTo(112+Math.cos(ang)*14,30+Math.sin(ang)*14);c.stroke();
  Bench.txt(c,`${Math.round(rpm)} rpm`,112,48,'#cfe0ff','center');
  if(d&&d.cur){const l=d.cur.lam;Bench.txt(c,T.has('wideband')?(l*14.7).toFixed(1):'--',144,8,Math.abs(l-d.cur.tgt)<0.02?'#7dff7d':l<d.cur.tgt?'#ffb347':'#ff6060','center',8);Bench.txt(c,'AFR',144,18,'#8fa3d8','center');
    if(d.cur.kd>0.3)Bench.txt(c,'KNOCK',144,30,Math.floor(t*6)%2?'#ff4040':'#ffd84a','center',6);
    Bench.txt(c,`${Math.round(d.cur.hp)} hp`,144,40,'#ffd84a','center',6);}
  // power trace
  if(d&&d.trace.length){BP(c,4,4,84,24,'#0d1020');const mx=Math.max(...d.trace.map(p=>p.hp),1);
    d.trace.forEach((p,i)=>{BP(c,6+p.r*80,26-p.hp/mx*20,1,1,'#ffd84a');BP(c,6+p.r*80,26-U.clamp((p.lam*14.7-10)/6,0,1)*20,1,1,'#7fd3ff');});
    Bench.txt(c,'power',6,5,'#ffd84a');Bench.txt(c,'afr',30,5,'#7fd3ff');}
  Bench.s.drops=Bench.s.drops.filter(p=>(p.t+=dt)<0.8);for(const p of Bench.s.drops){p.x+=p.vx*dt;p.y+=p.vy*dt;c.globalAlpha=1-p.t;BP(c,p.x,p.y,3,3,p.c);c.globalAlpha=1;}
};
Bench.dynoStep = (v,dt)=>{const d=Bench.s.dyno;if(!d||!d.running)return;d.tt+=dt;const b=D.BODY[v.body];const bins=D.RPM_B[b.cls];
  const f=U.clamp(d.tt/4,0,1);d.rpm=bins[1]+(bins[7]-bins[1])*f;const ic=Math.min(7,Math.max(0,Math.round(f*6)+1));
  const ev=d.ev;const lamC=ev.cells?ev.cells[5][ic]:ev.lam.wot;const tgt=v.eng.fuel==='efi'?v.eng.efi.afr[5][ic]/14.7:D.LAM.wot;
  const st=E.vs(v);const hp=(st.spd*0.6+st.acc*0.4)*0.45*Math.exp(-Math.pow((ic-5)/3,2))*0.6+(st.spd*0.6+st.acc*0.4)*0.45*0.4*(ic/7);const pf=T.pf(lamC,'wot');
  d.cur={lam:lamC*(1+U.rand(-0.008,0.008)),tgt,kd:ev.kd.wot,hp:hp*pf*ev.tf.wot,ic};d.trace.push({r:f,hp:d.cur.hp,lam:d.cur.lam});
  if(f>=1){d.running=false;d.done=true;}};

  h+=`<div class="hd">NEWS</div>`+G.log.slice(0,8).map(l=>`<div class="nw">${E.dateStr(l.d)} · ${U.esc(l.t)}</div>`).join('');

UI.startRace = (def,v,s,tactic,sid)=>{
  const opts={};if(sid){opts.series=sid;opts.rivals=G.series[sid].act.rivals;}
  const rs=Race.create(def,{vid:v.id,sid:s.id,tactic},opts);UI.race=rs;UI.raceSpeed=G.settings.raceSpeed||1;
  $('race').classList.remove('hidden');$('rResult').classList.add('hidden');
  $('rTitle').textContent=(sid?D.SER[sid].n+' · ':'')+def.n+(rs.rain?' ☔':'');
  UI.raceCtl();SFX.play('start');
};
UI.raceCtl = ()=>{const rs=UI.race;if(!rs)return;const sp=G.sparks;
  $('rCtl').innerHTML=`<div class="r">${Object.entries(Race.TAC).map(([k,t])=>`<button data-r="tac" data-v="${k}" class="${rs.tactic===k?'on':''}">${t.n}</button>`).join('')}</div>
   <div class="r">${[['b','Bronze'],['s','Silver'],['g','Gold']].map(([k,n])=>`<button data-r="spark" data-v="${k}" ${sp[k]?'':'disabled style="opacity:.4"'}>✨${n} ×${sp[k]}</button>`).join('')}</div>
   <div class="r">${[1,2,4].map(x=>`<button data-r="spd" data-v="${x}" class="${UI.raceSpeed===x?'on':''}">${x}×</button>`).join('')}<button class="sk" data-r="skip">Skip ⏭</button><button class="rt" data-r="retire">Retire</button></div>`;};
UI.raceClick = e=>{const b=e.target.closest('[data-r]');if(!b||!UI.race)return;const rs=UI.race;const a=b.dataset.r;SFX.play('click');
  if(a==='tac')rs.tactic=b.dataset.v;else if(a==='spark'){Race.useSpark(rs,b.dataset.v);}
  else if(a==='spd'){UI.raceSpeed=+b.dataset.v;G.settings.raceSpeed=UI.raceSpeed;}
  else if(a==='skip'){Race.runInstant(rs);}
  else if(a==='retire'){if(!rs.player.fin&&!rs.player.dnf)UI.popup({title:'Retire?',html:'Pull out of the race to protect the vehicle?',buttons:[{t:'Keep racing',cls:'gray'},{t:'Retire',cls:'red',fn:()=>Race.retire(rs)}]});}
  UI.raceCtl();};
UI.raceFrame = (dt)=>{
  const rs=UI.race;if(!rs)return;
  if(!rs.done&&!UI.popOpen){let t=dt*UI.raceSpeed;while(t>0){const s=Math.min(0.05,t);Race.step(rs,s);t-=s;if(rs.done)break;}}
  const cv=$('rcv');const c=cv.getContext('2d');c.setTransform(3,0,0,3,0,0);GX.drawRace(c,rs,dt*UI.raceSpeed);
  const P=rs.player;const pos=rs.order.indexOf(P)+1;const lap=Math.min(rs.tr.laps,Math.floor(Math.max(0,rs.order[0].prog)/rs.tr.lapLen)+1);
  $('rInfo').innerHTML=`${rs.tr.p2p?'Stage':`Lap ${lap}/${rs.tr.laps}`} · <b class="hl">${P.dnf&&!P.fin?'DNF':'P'+pos}</b>/${rs.ents.length}<br>HP <span style="color:${P.hp>0.5?'#8ef58e':P.hp>0.25?'#ffd84a':'#ff7070'}">${'█'.repeat(Math.max(0,Math.ceil(P.hp*10)))}${'░'.repeat(10-Math.max(0,Math.ceil(P.hp*10)))}</span> ${Math.max(0,Math.round(P.hp*100))}%`;
  const m=rs.msgs[rs.msgs.length-1];$('rComm').textContent=m?m.text:'';
  const L=rs.order[0];const vv=Math.max(0.1,L.v||1);
  const rows=rs.order.slice(0,8);if(!rows.includes(P))rows[7]=P;
  $('rBoard').innerHTML=rows.map(e=>{const p=rs.order.indexOf(e)+1;const gap=e===L?(e.fin?'FIN':'Leader'):e.dnf&&!e.fin?'DNF':e.fin?'+'+(e.finT-L.finT).toFixed(1)+'s':'+'+Math.max(0,(L.prog-e.prog)/vv).toFixed(1)+'s';
    return `<div class="lr ${e.isPlayer?'me':''}"><span class="p">${p}.</span><span class="sw" style="background:${e.col}"></span><span class="n">${U.esc(e.isPlayer?G.team.name+' ('+e.name+')':e.team)}</span><span>${gap}</span></div>`;}).join('');
  if(rs.done&&!rs.resolved){rs.resolved=true;setTimeout(()=>UI.raceResult(rs),700);}
};
UI.raceResult = (rs)=>{
  const out=E.finishRace(rs);if(rs.series)E.seriesRoundDone(rs.series,rs);
  const pos=out.pos;const big=out.dnf?(out.destroyed?'💥 WRECKED':'DNF'):pos===1?'🏆 VICTORY!':pos<=3?`🎉 ${U.ord(pos)} PLACE`:`${U.ord(pos)} place`;
  SFX.play(out.dnf?'crash':pos===1?'fanfare':pos<=3?'good':'click');
  let h=`<div class="big">${big}</div><div style="text-align:center" class="sub">${U.esc(rs.def.n)}${rs.series?' · '+U.esc(D.SER[rs.series].n):''}</div>
    <div class="card" style="margin-top:8px"><div class="grid2"><span>Prize <b class="gd">${U.money(out.prize)}</b></span><span>Research <b class="bl">+${out.rp} RP</b></span><span>Fans <b style="color:#ff9fcf">+${U.num(out.fans)}</b></span><span>${out.vlv?`Vehicle <b class="hl">Lv${out.vlv}!</b>`:''}</span></div>
    ${out.rep?'<div class="sub">Repeat win this year — reduced rewards.</div>':''}${out.spark?`<div class="hl">✨ Earned a ${{b:'Bronze',s:'Silver',g:'Gold'}[out.spark]} Spark!</div>`:''}${out.destroyed?'<div class="bd">The vehicle was destroyed.</div>':''}</div>`;
  h+=`<div class="sec-h">Results</div><div class="stand">${rs.order.slice(0,8).map((e,i)=>`<div class="${e.isPlayer?'me':''}">${i+1}. ${U.esc(e.isPlayer?G.team.name:e.team)}${e.dnf&&!e.fin?' (DNF)':''}</div>`).join('')}</div>`;
  if(rs.series&&G.series[rs.series].act)h+=`<div class="sec-h">Championship</div><div class="stand">${E.standings(rs.series).slice(0,5).map((x,i)=>`<div class="${x[0]==='you'?'me':''}">${i+1}. ${U.esc(x[0]==='you'?G.team.name:x[0])} — ${x[1]}</div>`).join('')}</div>`;
  if(out.unl.length)h+=`<div class="sec-h">Unlocked!</div>${out.unl.map(id=>`<div class="hl">🔓 ${U.esc(D.RACE[id]?D.RACE[id].n:D.SER[id].n+' (Series)')}</div>`).join('')}`;
  h+=`<button class="btn big grn" style="margin-top:10px" data-r2="done">Continue</button>`;
  $('rResult').innerHTML=`<div class="pw">${h}</div>`;$('rResult').classList.remove('hidden');
  $('rResult').querySelector('[data-r2]').onclick=()=>{SFX.play('click');UI.race=null;$('race').classList.add('hidden');Save.save();UI.hud();const d=UI.deferPop;UI.deferPop=[];d.forEach(o=>UI.popup(o));};
};
